<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Merit — Test Prep</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#12182B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   Palette: exam-ledger navy ink, warm paper background, brass
   "mastery" gold, hairline rule, correct/incorrect signal colors.
   Type: Source Serif 4 (display/headings) + Inter (body/UI) +
   IBM Plex Mono (scores, percentages, counters — the "data" face).
   Signature: course cards styled like admit cards / roll-number
   slips with a perforated edge and a corner progress stub, since
   this product's whole world is entrance-test admission.
   ============================================================ */
:root{   
  --ink:#12182B;
  --ink-soft:#4A5169;
  --paper:#F6F3EA;
  --paper-raised:#FFFFFF;
  --rule:#DBD3BF;
  --gold:#AD8A2E;
  --gold-soft:#F1E6C8;
  --correct:#2F7D5C;
  --correct-soft:#00b5b5;
  --incorrect:#ff0011;
  --incorrect-soft:#F7E6DE;
  --shadow: 0 2px 3px rgba(18,24,43,.10), 0 12px 26px -10px rgba(18,24,43,.30);
  --card-border:#BDB396;
  --teal:#00B8A9;
  --teal-deep:#007F74;
  --track:#D3DAE6;
  --flame:#F2641A;
  --radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:76px;
}
h1,h2,h3,.serif{ font-family:'Source Serif 4', Georgia, serif; }
.mono{ font-family:'IBM Plex Mono', monospace; }
button{ font-family:inherit; cursor:pointer; }
a{color:inherit;}
::selection{ background:var(--gold-soft); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ---------- App shell ---------- */
#app{ max-width:640px; margin:0 auto; min-height:100vh; position:relative; background:var(--paper); }

header.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--paper); border-bottom:1px solid var(--rule);
  padding:18px 18px 14px;
}
.brand{ display:flex; align-items:center; justify-content:space-between; }
.brand-mark{ display:flex; align-items:center; gap:10px; }
.brand-badge{
  width:34px;height:34px;border-radius:9px;
  background:var(--ink); color:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;
  font-family:'Source Serif 4',serif; font-weight:700; font-size:17px;
}
.brand-name{ font-family:'Source Serif 4',serif; font-weight:700; font-size:20px; letter-spacing:.2px; }
.brand-tag{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.12em; margin-top:1px;}
.stat-pill{
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:20px;
  padding:6px 10px; color:var(--ink-soft);
}

.breadcrumbs{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-soft); margin-top:12px;
}
.breadcrumbs button{
  background:none;border:none;color:var(--ink-soft);font-size:12.5px;padding:2px 0;
  border-bottom:1px solid transparent;
}
.breadcrumbs button:hover{ color:var(--ink); border-color:var(--rule); }
.breadcrumbs .sep{ color:var(--rule); }
.breadcrumbs .current{ color:var(--ink); font-weight:600; }

main{ padding:16px 18px 28px; }

/* ---------- Tab bar ---------- */
nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--paper-raised); border-top:1px solid var(--rule);
}
.tabbar-inner{
  max-width:640px; margin:0 auto;
  display:grid; grid-template-columns:repeat(3,1fr);
}
.tab-btn{
  background:none; border:none; padding:10px 4px 12px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--ink-soft); font-size:11.5px; font-weight:600;
  letter-spacing:.02em;
}
.tab-btn svg{ width:21px; height:21px; }
.tab-btn.active{ color:var(--ink); }
.tab-btn.active svg{ stroke:var(--gold); }
.tab-btn .dot{ width:4px;height:4px;border-radius:50%; background:var(--gold); opacity:0; margin-top:-2px; }
.tab-btn.active .dot{ opacity:1; }

/* ---------- Section heading ---------- */
.section-head{ margin:4px 0 14px; }
.section-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); font-weight:700; }
.section-title{ font-size:23px; font-weight:600; margin:3px 0 2px; }
.section-sub{ font-size:13.5px; color:var(--ink-soft); }

/* ---------- Course cards: "admit card" signature ---------- */
.course-grid{ display:flex; flex-direction:column; gap:14px; }
.admit-card{
  position:relative;
  background:var(--paper-raised);
  border:1.5px solid var(--card-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  overflow:hidden;
  text-align:left;
  width:100%;
  padding:0;
}
.admit-main{ flex:1; padding:16px 14px 15px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
.admit-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.admit-course-name{ font-family:'Source Serif 4',serif; font-weight:600; font-size:17px; line-height:1.2; }
.admit-course-full{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.star-btn{ background:none; border:none; padding:4px; flex-shrink:0; color:var(--rule); }
.star-btn.active{ color:var(--gold); }
.star-btn svg{ width:19px; height:19px; }
.admit-meta{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--ink-soft); }
.progress-track{ flex:1; height:9px; border-radius:6px; background:var(--track); box-shadow:inset 0 0 0 1px rgba(18,24,43,.14); overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--teal-deep)); border-radius:6px; min-width:0; transition:width .4s ease; }
.progress-pct{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--ink); min-width:30px; text-align:right; }
.admit-stub{
  border:none; font:inherit; cursor:pointer;
  width:70px; flex-shrink:0;
  background:var(--ink); color:var(--gold-soft);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-left:2px dashed var(--rule);
  position:relative;
}
.admit-stub::before, .admit-stub::after{
  content:''; position:absolute; left:-6px; width:12px; height:12px; border-radius:50%;
  background:var(--paper);
}
.admit-stub::before{ top:-6px; }
.admit-stub::after{ bottom:-6px; }
.admit-stub-num{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; }
.admit-stub-label{ font-size:8.5px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; }

/* ---------- Personalized dashboard ---------- */
.brand-stats{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.stat-pill.streak{ color:var(--flame); border-color:#F2B48E; background:#FFF4EC; }
.stat-pill.streak.cold{ color:var(--ink-soft); border-color:var(--rule); background:var(--paper-raised); }
.greet{ margin:2px 0 14px; }
.greet-title{ font-family:'Source Serif 4',serif; font-weight:700; font-size:24px; line-height:1.2; }
.greet-sub{ font-size:13.5px; color:var(--ink-soft); margin-top:4px; line-height:1.45; }
.link-btn{ background:none; border:none; padding:0; font:inherit; font-size:12px; color:var(--teal-deep); text-decoration:underline; cursor:pointer; }
.goal-card{
  background:var(--paper-raised); border:1.5px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:13px 15px 14px; margin-bottom:14px;
}
.goal-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; }
.goal-label{ font-size:11px; text-transform:uppercase; letter-spacing:.12em; font-weight:700; color:var(--gold); }
.goal-count{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }
.goal-done .goal-count{ color:var(--teal-deep); }
.hero{
  background:var(--ink); color:var(--paper); border-radius:var(--radius);
  padding:18px 18px 16px; margin-bottom:22px; box-shadow:0 14px 30px -12px rgba(18,24,43,.55);
  border:1.5px solid var(--ink); display:flex; flex-direction:column; gap:6px;
}
.hero-eyebrow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--teal); }
.hero-course{ font-size:11.5px; color:#C9CBD8; }
.hero-title{ font-family:'Source Serif 4',serif; font-weight:600; font-size:20px; line-height:1.25; }
.hero-sub{ font-size:12.5px; color:#C9CBD8; line-height:1.45; }
.hero-btn{
  margin-top:10px; width:100%; border:none; border-radius:11px; padding:14px 16px;
  background:var(--teal); color:#03231F; font-weight:700; font-size:15px; font-family:inherit; cursor:pointer;
  box-shadow:0 6px 16px -6px rgba(0,184,169,.7);
}
.hero-btn:active{ transform:translateY(1px); }
.sec-label{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--gold); margin:4px 2px 10px; }
.admit-stub-cta{ width:26px; height:26px; border-radius:50%; background:var(--teal); color:#03231F; display:flex; align-items:center; justify-content:center; margin-bottom:3px; }
.admit-stub-cta svg{ width:14px; height:14px; }
.admit-stub-label{ font-weight:700; opacity:.95; }
.admit-sub{ font-size:11.5px; color:var(--ink-soft); }
.mini-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
.mini-card{
  display:flex; align-items:center; gap:10px; background:var(--paper-raised);
  border:1.5px solid var(--card-border); border-radius:12px; box-shadow:var(--shadow); padding:0 6px 0 0; overflow:hidden;
}
.mini-main{ flex:1; min-width:0; background:none; border:none; text-align:left; padding:12px 6px 12px 14px; font:inherit; color:inherit; cursor:pointer; }
.mini-name{ font-weight:600; font-size:14px; }
.mini-full{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
.mini-pct{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--ink-soft); }

/* ---------- Generic list rows (subjects, chapters, topics) ---------- */
.row-list{ display:flex; flex-direction:column; gap:10px; }
.row-card{
  background:var(--paper-raised); border:1.5px solid var(--card-border); border-radius:12px;
  padding:14px 14px; display:flex; align-items:center; gap:12px;
  text-align:left; width:100%; box-shadow:var(--shadow);
}
.row-icon{
  width:38px;height:38px;border-radius:10px; flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft); color:var(--gold); font-weight:700; font-family:'Source Serif 4',serif;
}
.row-body{ flex:1; min-width:0; }
.row-title{ font-weight:600; font-size:14.5px; }
.row-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.row-chev{ color:var(--rule); flex-shrink:0; }
.row-chev svg{ width:18px;height:18px; }
.row-card.mastered .row-icon{ background:var(--correct-soft); color:var(--correct); }
.badge{
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; padding:3px 7px; border-radius:20px;
  border:1px solid var(--rule); color:var(--ink-soft); flex-shrink:0;
}
.badge.mastered{ background:var(--correct-soft); color:var(--correct); border-color:transparent; }
.badge.practicing{ background:var(--gold-soft); color:var(--gold); border-color:transparent; }

/* mastery block at end of topic list */
.mastery-block{
  margin-top:18px; padding:18px; border-radius:var(--radius);
  background:var(--ink); color:var(--paper);
  display:flex; flex-direction:column; gap:10px;
  border:1px solid var(--ink);
}
.mastery-block .m-eyebrow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); font-weight:700; }
.mastery-block h3{ margin:0; font-size:18px; }
.mastery-block p{ margin:0; font-size:12.5px; color:#C9CBD8; line-height:1.5; }
.mastery-block .m-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:4px; }
.btn-primary{
  background:var(--gold); color:var(--ink); border:none; border-radius:10px;
  padding:11px 18px; font-weight:700; font-size:13.5px; white-space:nowrap;
}
.btn-primary:disabled{ opacity:.5; }
.btn-ghost{
  background:transparent; color:inherit; border:1px solid var(--rule); border-radius:10px;
  padding:10px 16px; font-weight:600; font-size:13.5px;
}
.mastery-block .btn-ghost{ border-color:#3A4058; color:var(--paper); }

/* ---------- Empty state ---------- */
.empty{ text-align:center; padding:56px 20px; color:var(--ink-soft); }
.empty svg{ width:38px;height:38px; color:var(--rule); margin-bottom:10px; }
.empty p{ font-size:13.5px; max-width:260px; margin:0 auto; line-height:1.5; }
.empty strong{ color:var(--ink); }

/* ---------- Quiz ---------- */
.quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.quiz-progress-track{ flex:1; height:6px; background:var(--rule); border-radius:4px; margin:0 12px; overflow:hidden; }
.quiz-progress-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--teal-deep)); }
.quiz-count{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
.bonus-flag{
  display:inline-flex; align-items:center; gap:5px; background:var(--gold-soft); color:var(--gold);
  font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; margin-bottom:10px;
}
.q-card{
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius);
  padding:20px 18px; box-shadow:var(--shadow);
}
.q-text{ font-size:16.5px; font-weight:600; line-height:1.4; margin:0 0 16px; font-family:'Source Serif 4',serif; }
.options{ display:flex; flex-direction:column; gap:9px; }
.option-btn{
  text-align:left; background:var(--paper); border:1.5px solid var(--rule); border-radius:11px;
  padding:12px 14px; font-size:14px; display:flex; align-items:center; gap:11px; line-height:1.4;
  width:100%;
}
.option-letter{
  width:24px;height:24px;border-radius:50%; border:1.5px solid var(--rule); flex-shrink:0;
  display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
}
.option-btn:not(:disabled):hover{ border-color:var(--gold); }
.option-btn.selected{ background:var(--gold-soft); border-color:var(--gold); }
.option-btn.selected .option-letter{ background:var(--gold); border-color:var(--gold); color:#fff; }
.option-btn.correct{ background:var(--correct-soft); border-color:var(--correct); }
.option-btn.correct .option-letter{ background:var(--correct); border-color:var(--correct); color:#fff; }
.option-btn.incorrect{ background:var(--incorrect-soft); border-color:var(--incorrect); }
.option-btn.incorrect .option-letter{ background:var(--incorrect); border-color:var(--incorrect); color:#fff; }
.option-btn:disabled{ opacity:.72; }
.option-btn:disabled.correct, .option-btn:disabled.incorrect{ opacity:1; }

.explain{
  margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.5;
  background:var(--paper); border:1px solid var(--rule); color:var(--ink-soft);
}
.explain strong{ color:var(--ink); }
.q-footer{ margin-top:16px; display:flex; justify-content:flex-end; }

/* ---------- Results ---------- */
.result-card{
  background:var(--ink); color:var(--paper); border-radius:var(--radius); padding:28px 22px;
  text-align:center; box-shadow:var(--shadow);
}
.result-ring{
  width:112px;height:112px;border-radius:50%; margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--pct)*1%), #2A3050 0);
  position:relative;
}
.result-ring::before{ content:''; position:absolute; inset:8px; border-radius:50%; background:var(--ink); }
.result-ring-label{ position:relative; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px; }
.result-title{ font-size:19px; font-weight:600; margin:0 0 4px; }
.result-sub{ font-size:13px; color:#C9CBD8; margin:0 0 18px; }
.result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.result-card .btn-ghost{ border-color:#3A4058; color:var(--paper); }

/* misc */
.top-actions{ display:flex; justify-content:flex-end; margin-bottom:4px; }
.icon-btn{ background:none; border:none; color:var(--ink-soft); display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:6px; }
/* ---------- MDCAT Mock Test ---------- */
.mock-row{ border-color:var(--gold); background:var(--gold-soft); }
.topic-group{ margin:16px 2px 2px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--gold); }
.topic-group:first-child{ margin-top:2px; }
.row-card.static{ cursor:default; }
.mock-head{
  position:sticky; top:0; z-index:25; background:var(--paper);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  margin:-16px -18px 12px; padding:max(12px, env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--rule);
}
.mock-head .icon-btn{ justify-self:start; }
.mock-timer{ font-size:22px; font-weight:700; letter-spacing:.04em; text-align:center; color:var(--ink); }
.mock-timer.warn{ color:var(--incorrect); }
.mock-sub{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--gold);
}
.mock-sub .mono{ color:var(--ink-soft); letter-spacing:.02em; text-transform:none; font-size:12px; }
.mock-qn{ color:var(--gold); font-size:13px; margin-right:4px; }
.mock-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:16px; }
.mock-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:14px; }
.btn-ghost:disabled{ opacity:.4; cursor:default; }
.pal-wrap{ margin-top:14px; padding:14px; background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius); }
.pal-title{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); margin:10px 0 6px; }
.pal-title:first-child{ margin-top:0; }
.pal{ display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:6px; }
.pal button{
  height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--paper);
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--ink-soft); padding:0;
}
.pal button.done{ background:var(--gold-soft); border-color:var(--gold); color:var(--ink); }
.pal button.cur{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.mock-legend{ margin:0 0 4px; font-size:12px; color:#C9CBD8; line-height:1.5; }
.review-item{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:12px; padding:14px; margin-top:10px; font-size:13.5px; line-height:1.5; }
.review-item .rq{ font-family:'Source Serif 4',serif; font-weight:600; font-size:15px; margin-bottom:8px; }
.review-item .rq .mono{ color:var(--gold); font-size:12.5px; margin-right:4px; }
.review-item .ra{ color:var(--ink-soft); }
.review-item .ra b{ color:var(--ink); }
.review-item .wrong b{ color:var(--incorrect); }
.review-item .right b{ color:var(--correct); }
.review-item .rnote{ margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--gold-soft); font-size:12.5px; color:var(--ink); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================================================================
   DATA MODEL
   Course -> Subjects -> Chapters -> Topics. Every object has a
   stable `id` used as the progress-tracking key. Each subject has
   a `type` that selects which question-template set is used to
   generate its practice questions.
   ================================================================ */

const CUSTOM_QUESTION_BANKS = {
  // ---- SAT · Math · Get ready: Algebra · topics 8+ (6 questions per topic: 5 shown + 1 bonus) ----
  "sat-math-gra-c1-t1": [
 {
  "q": "A service charges a fixed fee of $6 plus $9 per item. If the total is $42, how many items?",
  "options": [
   "4",
   "3",
   "6",
   "5"
  ],
  "correct": 0,
  "explain": "Subtract the fixed fee: 42 − 6 = 36. Divide by the price per item: 36 ÷ 9 = 4 items."
 },
 {
  "q": "A service charges a fixed fee of $12 plus $5 per item. If the total is $57, how many items?",
  "options": [
   "11",
   "9",
   "8",
   "10"

  // ---- Chapter 1 · Acellular Life · Viruses (PMDC MDCAT syllabus) ----
  // 42 hand-authored, syllabus-accurate MCQs covering discovery, structure,
  // classification, lytic/lysogenic cycles, and the major viral diseases
  // (excluding HIV/AIDS, which has its own dedicated bank below).
  'mdcat-bio-c1-t1': [
    { q:`Viruses are obligate intracellular parasites primarily because they lack:`, options:[`Genetic material (DNA or RNA)`,`Metabolic machinery and ribosomes`,`A protective protein coat`,`Specific host receptor binding proteins`], correct:1, explain:`Viruses have no ribosomes or metabolic enzymes of their own, so they must hijack a host cell's machinery to replicate — that's what makes them obligate intracellular parasites.` },
    { q:`Which scientist first demonstrated that the causative agent of Tobacco Mosaic Disease could pass through porcelain filters that trap bacteria?`, options:[`Louis Pasteur`,`Dmitri Ivanowsky`,`Martinus Beijerinck`,`Wendell Stanley`], correct:1, explain:`Dmitri Ivanowsky (1892) showed the infectious sap agent passed through bacteria-proof filters, though he still assumed it was a toxin or unusually small bacterium.` },
    { q:`Who successfully crystallized Tobacco Mosaic Virus (TMV) for the first time in 1935, confirming its chemical nature?`, options:[`W. M. Stanley`,`F. Twort`,`F. d'Herelle`,`Robert Koch`], correct:0, explain:`Wendell Stanley crystallized TMV in 1935, showing that a virus could behave as a discrete chemical entity.` },
    { q:`The complete, mature, and infectious viral particle outside a host cell is termed a:`, options:[`Capsid`,`Virion`,`Viroid`,`Provirus`], correct:1, explain:`A virion is the complete infective particle — nucleic acid genome enclosed in its capsid (and envelope, if present).` },
    { q:`The protein shell that encloses the viral nucleic acid genome is known as the:`, options:[`Capsomere`,`Peplomer`,`Capsid`,`Envelope`], correct:2, explain:`The capsid is the protective protein coat; capsomeres are simply the individual protein subunits that build it.` },
    { q:`Capsomeres are individual protein subunits that make up the capsid. How many capsomeres compose the capsid of an Adenovirus?`, options:[`162 capsomeres`,`252 capsomeres`,`60 capsomeres`,`2130 capsomeres`], correct:1, explain:`Adenovirus has an icosahedral capsid built from 252 capsomeres.` },
    { q:`The icosahedral capsid symmetry of Herpes virus contains how many capsomeres?`, options:[`162 capsomeres`,`252 capsomeres`,`2130 capsomeres`,`32 capsomeres`], correct:0, explain:`Herpesvirus capsids are icosahedral structures made of 162 capsomeres.` },
    { q:`The viral envelope present in certain animal viruses is derived primarily from:`, options:[`Viral protein synthesis in cytoplasm`,`Bacterial cell wall peptidoglycan`,`Host cell plasma membrane or nuclear membrane`,`Synthesized entirely de novo by viral genome`], correct:2, explain:`Enveloped viruses acquire their lipid envelope by budding through the host's plasma or nuclear membrane.` },
    { q:`Which of the following components is UNIQUE to enveloped viruses compared to non-enveloped (naked) viruses?`, options:[`Nucleic acid core`,`Capsomeres`,`Glycoprotein spikes (peplomers)`,`Icosahedral symmetry`], correct:2, explain:`Glycoprotein spikes, or peplomers, studding the lipid envelope are found only on enveloped viruses.` },
    { q:`Naked (non-enveloped) viruses are generally more resistant to lipid solvents (like ether/alcohol) than enveloped viruses because:`, options:[`They possess double-stranded DNA genomes`,`Their outer layer consists of protein capsids, not lipid bilayers`,`They reproduce only via the lysogenic cycle`,`They possess thick carbohydrate coats`], correct:1, explain:`With no lipid envelope to dissolve, ether or alcohol can't disrupt a naked virus's protein capsid the way it destroys enveloped viruses.` },
    { q:`Which of the following statements regarding viral genomes is TRUE?`, options:[`Viruses contain both DNA and RNA simultaneously`,`Viruses contain either DNA or RNA, never both`,`Viral genomes consist only of single-stranded RNA`,`Viral genomes consist only of double-stranded DNA`], correct:1, explain:`Every virus carries only one type of nucleic acid — DNA or RNA — never both at once.` },
    { q:`T4 bacteriophage exhibits a complex structural morphology consisting of:`, options:[`Helical head and icosahedral tail`,`Icosahedral head and helical tail`,`Spherical head and spherical tail`,`Filamentous head and no tail`], correct:1, explain:`T4 has a polyhedral (icosahedral) head that stores its DNA, attached to a helical, contractile tail.` },
    { q:`The tail fibers of a T4 bacteriophage function primarily in which step of viral infection?`, options:[`Penetration of the cell wall`,`Adsorption / Attachment to specific host cell receptors`,`Biosynthesis of viral proteins`,`Lysis of the host cell membrane`], correct:1, explain:`Tail fibers recognize and bind specific receptor molecules on the bacterial surface during adsorption, the first step of infection.` },
    { q:`During the penetration phase of a bacteriophage, which enzyme localized in the tail tube degrades the bacterial cell wall?`, options:[`Reverse transcriptase`,`Lysozyme`,`RNA polymerase`,`DNA ligase`], correct:1, explain:`Phage lysozyme in the tail digests a hole through the peptidoglycan wall, letting the tail inject viral DNA into the cell.` },
    { q:`In the lytic cycle of a bacteriophage, the period between infection and the appearance of mature intracellular virions is called:`, options:[`Lysogenic stage`,`Eclipse period`,`Latent state`,`Prophage induction`], correct:1, explain:`The eclipse period is the interval during which no complete, infectious virions can yet be detected inside the infected cell.` },
    { q:`Integrated viral DNA incorporated into the bacterial chromosome during the lysogenic cycle is called a:`, options:[`Provirus`,`Prophage`,`Plasmid`,`Viroid`], correct:1, explain:`In bacteria specifically, the integrated phage DNA is called a prophage — "provirus" is the equivalent term used for animal viruses.` },
    { q:`A bacterium harboring a prophage within its genome without being lysed is called a:`, options:[`Lytic bacterium`,`Lysogenic bacterium`,`Transformed bacterium`,`Virulent bacterium`], correct:1, explain:`A bacterium carrying a dormant prophage without being destroyed is described as lysogenic.` },
    { q:`The process by which environmental triggers (e.g., UV light or chemicals) cause a prophage to excise from host chromosome and enter the lytic cycle is called:`, options:[`Transduction`,`Induction`,`Transformation`,`Adsorption`], correct:1, explain:`Induction is the stress-triggered process that causes a dormant prophage to excise and switch back into the lytic cycle.` },
    { q:`Phages that undergo ONLY the lytic cycle, leading inevitably to host cell destruction, are known as:`, options:[`Temperate phages`,`Virulent phages`,`Avirulent phages`,`Retroviruses`], correct:1, explain:`Virulent phages always kill the host cell through the lytic cycle — they're incapable of lysogeny.` },
    { q:`Temperate phages are capable of undergoing:`, options:[`Only the lytic cycle`,`Only the lysogenic cycle`,`Both lytic and lysogenic cycles`,`Binary fission`], correct:2, explain:`Temperate phages can switch between the lysogenic (dormant) and lytic (destructive) cycles depending on host conditions.` },
    { q:`Hepatitis is broadly defined as inflammation of the:`, options:[`Kidneys`,`Liver`,`Spleen`,`Pancreas`], correct:1, explain:`The prefix "hepat-" refers to the liver, so hepatitis literally means liver inflammation.` },
    { q:`Which of the following Hepatitis viruses is a DOUBLE-STRANDED DNA virus?`, options:[`Hepatitis A Virus (HAV)`,`Hepatitis B Virus (HBV)`,`Hepatitis C Virus (HCV)`,`Hepatitis E Virus (HEV)`], correct:1, explain:`HBV is unusual among the hepatitis viruses in having a partially double-stranded DNA genome; the others are RNA viruses.` },
    { q:`Hepatitis A virus (HAV) is primarily transmitted through which route?`, options:[`Blood transfusion`,`Fecal-oral route (contaminated food/water)`,`Sexual contact`,`Respiratory droplets`], correct:1, explain:`HAV spreads mainly through the fecal-oral route via contaminated food or water.` },
    { q:`Which type of Hepatitis is commonly referred to as "Serum Hepatitis"?`, options:[`Hepatitis A`,`Hepatitis B`,`Hepatitis C`,`Hepatitis E`], correct:1, explain:`Hepatitis B, transmitted through blood and serum products, earned the historical nickname "serum hepatitis."` },
    { q:`Which hepatitis virus is an RNA virus frequently causing chronic liver disease, cirrhosis, and liver cancer, often transmitted via infected blood?`, options:[`HAV`,`HCV`,`HEV`,`HDV`], correct:1, explain:`HCV is an RNA virus notorious for silent chronic infection that can progress to cirrhosis and hepatocellular carcinoma.` },
    { q:`Hepatitis D (Delta virus) is a defective virus that can replicate ONLY in the presence of a co-infection with:`, options:[`Hepatitis A virus`,`Hepatitis B virus`,`Hepatitis C virus`,`Human Immunodeficiency Virus`], correct:1, explain:`HDV is a defective satellite virus that needs HBV's surface antigen coat to assemble infectious particles.` },
    { q:`Influenza virus possesses a segmented genome composed of:`, options:[`Single-stranded DNA`,`Double-stranded DNA`,`Single-stranded RNA`,`Double-stranded RNA`], correct:2, explain:`Influenza's genome consists of eight separate segments of single-stranded RNA.` },
    { q:`The major envelope spikes responsible for attachment to host sialic acid receptors in Influenza virus are:`, options:[`Hemagglutinin (HA)`,`Neuraminidase (NA)`,`Reverse Transcriptase`,`gp120`], correct:0, explain:`Hemagglutinin binds sialic acid receptors on host cells to initiate attachment; neuraminidase instead helps release new virions from the cell.` },
    { q:`Poliovirus is characterized as a:`, options:[`Large enveloped DNA virus`,`Small non-enveloped RNA virus (Picornavirus)`,`Complex enveloped retrovirus`,`Helical enveloped DNA virus`], correct:1, explain:`Poliovirus is a small, non-enveloped, positive-sense RNA virus belonging to the Picornaviridae family.` },
    { q:`Poliovirus primarily targets motor neurons located in the:`, options:[`Cerebral cortex`,`Anterior horn of the spinal cord`,`Cerebellum`,`Peripheral sensory ganglia`], correct:1, explain:`Poliovirus destroys motor neurons in the anterior horn of the spinal cord, causing the disease's characteristic flaccid paralysis.` },
    { q:`Herpes simplex virus type 1 (HSV-1) primarily causes vascular lesions and cold sores around the:`, options:[`Genital region`,`Mouth and lips (oral mucosa)`,`Abdominal skin`,`Palms and soles`], correct:1, explain:`HSV-1 typically causes oral and perioral cold sores, while HSV-2 is more commonly associated with genital lesions.` },
    { q:`Smallpox is caused by which of the following viruses?`, options:[`Varicella-zoster virus`,`Poxvirus (Variola virus)`,`Paramyxovirus`,`Epstein-Barr virus`], correct:1, explain:`Smallpox is caused by Variola virus, a member of the Poxviridae family.` },
    { q:`Infectious sub-viral particles composed ONLY of protein without any nucleic acid are called:`, options:[`Viroids`,`Prions`,`Virions`,`Satellite viruses`], correct:1, explain:`Prions are misfolded infectious proteins that entirely lack nucleic acid — unlike every true virus.` },
    { q:`Mad Cow Disease (Bovine Spongiform Encephalopathy) and Kuru in humans are caused by:`, options:[`Single-stranded RNA viroids`,`Misfolded infectious proteins (Prions)`,`Enveloped DNA retroviruses`,`Defective bacteriophages`], correct:1, explain:`Both BSE and Kuru are prion diseases, caused by misfolded PrP proteins that induce further misfolding in normal proteins.` },
    { q:`Viroids differ from viruses in that viroids consist exclusively of:`, options:[`Circular double-stranded DNA without protein`,`Small, circular single-stranded RNA lacking a capsid coat`,`Protein capsids lacking nucleic acids`,`Enveloped RNA-protein complexes`], correct:1, explain:`Viroids are naked, small, circular single-stranded RNA molecules with no protective protein coat at all.` },
    { q:`Which of the following diseases is caused by Viroids?`, options:[`Creutzfeldt-Jakob disease`,`Potato spindle tuber disease`,`Rabies`,`Measles`], correct:1, explain:`Potato spindle tuber disease is the classic textbook example of a plant disease caused by a viroid.` },
    { q:`Rabies virus is a bullet-shaped virus belonging to Rhabdoviridae family that targets the:`, options:[`Gastrointestinal tract`,`Central Nervous System (CNS)`,`Renal system`,`Respiratory alveoli`], correct:1, explain:`Rabies virus travels along peripheral nerves to reach and infect the central nervous system, causing fatal encephalitis.` },
    { q:`Vaccines provide immunity against viral diseases by stimulating host production of:`, options:[`Antibiotics`,`Specific Antibodies and Memory cells`,`Interferon inhibitors`,`Viral capsomeres`], correct:1, explain:`Vaccines prime the adaptive immune system to generate pathogen-specific antibodies and long-lived memory cells.` },
    { q:`Proteins produced by host cells in response to viral infection that inhibit viral replication in neighboring healthy cells are:`, options:[`Immunoglobulins`,`Interferons`,`Interleukins`,`Histamines`], correct:1, explain:`Interferons are signaling proteins released by infected cells that warn and protect neighboring healthy cells against viral replication.` },
    { q:`Antibiotics are completely ineffective against viral infections because viruses:`, options:[`Possess thick protein capsids`,`Lack cellular structures, metabolic pathways, and cell walls targeted by antibiotics`,`Mutate too rapidly for drugs to work`,`Are protected inside host nuclear membranes`], correct:1, explain:`Antibiotics work by targeting bacterial cell walls or metabolic machinery — structures viruses simply don't possess.` },
    { q:`Which of the following is a classic clinical symptom of hydrophobia associated with Rabies infection?`, options:[`Severe fear and painful spasms when trying to swallow water`,`Yellowing of sclera and skin`,`Loss of memory and dementia`,`Extreme hyperpigmentation of skin`], correct:0, explain:`Hydrophobia — intense fear and painful throat spasms triggered by attempting to swallow water — is a hallmark late-stage symptom of rabies.` },
    { q:`The first vaccine ever successfully developed by Edward Jenner in 1796 was against which viral disease?`, options:[`Rabies`,`Smallpox`,`Polio`,`Influenza`], correct:1, explain:`Jenner's cowpox-based vaccine, the world's first, protected against smallpox.` },

  // ---- Chapter 1 · Acellular Life · AIDS and HIV Infection ----
  // 35 hand-authored MCQs covering HIV structure, receptors/co-receptors,
  // the full replication cycle, pathogenesis/AIDS-defining criteria,
  // opportunistic infections, transmission, diagnostics, and treatment
  // (from the PMDC MDCAT virology question set).
  'mdcat-bio-c1-t2': [
    { q:`Human Immunodeficiency Virus (HIV) belongs to which specific group of animal viruses?`, options:[`Adenoviruses`,`Retroviruses`,`Rhabdoviruses`,`Poxviruses`], correct:1, explain:`HIV is classified as a retrovirus, replicating via a DNA intermediate made from its RNA genome.` },
    { q:`The viral particle (virion) structure of HIV is best classified morphologically as:`, options:[`Naked icosahedral`,`Enveloped spherical with a cone-shaped capsid core`,`Filamentous helical`,`Complex biconcave without envelope`], correct:1, explain:`HIV is an enveloped, roughly spherical virus with a distinctive cone-shaped (conical) capsid core housing the RNA genome.` },
    { q:`The genome of HIV consists of:`, options:[`One molecule of double-stranded DNA`,`Two identical molecules of single-stranded (+ positive sense) RNA`,`Two non-identical single-stranded DNA molecules`,`Segmented double-stranded RNA`], correct:1, explain:`HIV packages two identical copies of positive-sense single-stranded RNA per virion.` },
    { q:`Which viral glycoprotein forms the outer projecting spikes on the HIV envelope that specifically bind host cell receptors?`, options:[`gp41`,`gp120`,`p24`,`p17`], correct:1, explain:`gp120 forms the outer envelope spikes that specifically recognize and bind the host CD4 receptor.` },
    { q:`The transmembrane glycoprotein of HIV responsible for fusion of the viral envelope with the host plasma membrane is:`, options:[`gp120`,`gp41`,`p24`,`Reverse Transcriptase`], correct:1, explain:`gp41 is the transmembrane glycoprotein that mediates fusion of the viral envelope with the host plasma membrane after gp120 binds CD4.` },
    { q:`The major structural core protein that forms the inner conical capsid shell of HIV is:`, options:[`p17`,`p24`,`gp120`,`gp41`], correct:1, explain:`p24 is the major structural protein forming HIV's conical capsid shell around the RNA genome.` },
    { q:`The matrix protein lining the inner surface of the HIV lipid bilayer envelope is:`, options:[`p17`,`p24`,`Integrase`,`Protease`], correct:0, explain:`p17 lines the inner surface of the viral envelope, forming the matrix layer that stabilizes the virion structure.` },
    { q:`Which primary receptor on human host immune cells is specifically recognized by HIV gp120?`, options:[`CD8 receptor`,`CD4 receptor`,`MHC Class I`,`Toll-like receptor 4`], correct:1, explain:`gp120 specifically binds the CD4 receptor on host immune cells to initiate infection.` },
    { q:`Which cell type serves as the main target and primary site of HIV infection and replication?`, options:[`B-lymphocyte`,`Helper T-lymphocyte (CD4+ T cell)`,`Cytotoxic T-lymphocyte (CD8+)`,`Red blood cell`], correct:1, explain:`CD4+ helper T lymphocytes are HIV's primary target and main site of replication.` },
    { q:`Besides Helper T-cells, which of the following immune cells also express CD4 receptors and act as reservoirs for HIV?`, options:[`Neutrophils and Basophils`,`Monocytes and Macrophages`,`Eosinophils and Platelets`,`Plasma cells`], correct:1, explain:`Monocytes and macrophages also express CD4 and serve as long-lived reservoirs for HIV.` },
    { q:`Which chemokine co-receptor on host cell membranes is required alongside CD4 for macrophage-tropic HIV strains to enter?`, options:[`CXCR4`,`CCR5`,`CD8`,`ACE2`], correct:1, explain:`CCR5 is the co-receptor required, alongside CD4, for entry of macrophage-tropic (R5) HIV strains.` },
    { q:`Which chemokine co-receptor is utilized primarily by T-cell tropic strains of HIV during later stages of infection?`, options:[`CCR5`,`CXCR4`,`CD3`,`gp120`], correct:1, explain:`CXCR4 is used by T-cell tropic (X4) HIV strains, which typically emerge during later, more aggressive stages of infection.` },
    { q:`Reverse Transcriptase is an enzyme that acts functionally as an:`, options:[`RNA-dependent RNA polymerase`,`RNA-dependent DNA polymerase`,`DNA-dependent RNA polymerase`,`DNA-dependent DNA polymerase`], correct:1, explain:`Reverse transcriptase synthesizes DNA using an RNA template, functioning as an RNA-dependent DNA polymerase.` },
    { q:`What key enzymatic process occurs inside the host cytoplasm immediately following uncoating of the HIV core?`, options:[`Translation of viral proteins`,`Synthesis of complementary DNA (cDNA) from viral RNA`,`Integration of DNA into host chromosomes`,`Cleavage of polyproteins`], correct:1, explain:`Immediately after uncoating, reverse transcriptase synthesizes complementary DNA (cDNA) from the viral RNA genome in the host cytoplasm.` },
    { q:`The double-stranded viral DNA intermediate produced by HIV before integration into the host genome is called:`, options:[`Prophage`,`Proviral DNA (cDNA)`,`Plasmid`,`Episome`], correct:1, explain:`The double-stranded DNA copy produced by reverse transcription, prior to integration, is called proviral DNA.` },
    { q:`Which viral enzyme inserts the newly synthesized double-stranded viral DNA into host cell genomic DNA?`, options:[`Reverse Transcriptase`,`Integrase`,`Protease`,`Helicase`], correct:1, explain:`Integrase is the enzyme that inserts the newly made viral DNA into the host cell's chromosomal DNA.` },
    { q:`Once the integrated viral DNA (provirus) is formed inside the host genome, it can remain dormant for years. This state is termed:`, options:[`Lytic phase`,`Latent phase (Latency)`,`Active replication phase`,`Apoptotic phase`], correct:1, explain:`Once integrated, the provirus can remain transcriptionally silent for years — a state known as latency.` },
    { q:`Transcription of integrated proviral DNA into new full-length viral RNA genomes and mRNA is carried out by:`, options:[`Viral Reverse Transcriptase`,`Host RNA Polymerase II`,`Viral Integrase`,`Host DNA Polymerase`], correct:1, explain:`Host RNA Polymerase II transcribes the integrated proviral DNA into new viral RNA genomes and mRNAs.` },
    { q:`Translation of HIV mRNA by host cell ribosomes initially produces long, non-functional protein precursors called:`, options:[`Capsomeres`,`Polyproteins (e.g., Gag, Gag-Pol)`,`Viroids`,`Peplomers`], correct:1, explain:`Host ribosomes initially translate HIV mRNA into long, non-functional polyprotein precursors such as Gag and Gag-Pol.` },
    { q:`Which viral enzyme cleaves polyproteins into individual, active structural proteins and enzymes during HIV maturation?`, options:[`Integrase`,`Protease`,`Reverse Transcriptase`,`Amylase`], correct:1, explain:`Protease cleaves the polyprotein precursors into individual functional structural proteins and enzymes during virion maturation.` },
    { q:`HIV acquires its lipid envelope containing surface spikes during which final step of its life cycle?`, options:[`Cell lysis`,`Budding through host plasma membrane`,`Endocytosis`,`Excision`], correct:1, explain:`HIV acquires its lipid envelope and surface spikes as it buds outward through the host cell's plasma membrane.` },
    { q:`The progressive decline of CD4+ T-helper cells in an HIV-infected patient leads directly to:`, options:[`Hyper-activation of B-cells`,`Severe compromise of cellular and humoral adaptive immunity`,`Excessive production of red blood cells`,`Autoimmune destruction of liver tissue`], correct:1, explain:`Progressive loss of CD4+ helper T-cells cripples both cellular and humoral (antibody-based) adaptive immune responses.` },
    { q:`Clinically, a diagnosis of full-blown AIDS is made when the CD4+ T-cell count falls below:`, options:[`1000 cells/µL`,`200 cells/µL`,`500 cells/µL`,`1200 cells/µL`], correct:1, explain:`A CD4+ T-cell count falling below 200 cells/µL is a clinical criterion for diagnosing full-blown AIDS.` },
    { q:`Which fungal opportunistic infection commonly causes pneumonia in advanced AIDS patients?`, options:[`Candida albicans`,`Pneumocystis jirovecii (carinii)`,`Aspergillus fumigatus`,`Rhizopus stolonifer`], correct:1, explain:`Pneumocystis jirovecii (formerly P. carinii) pneumonia is a classic fungal opportunistic infection in advanced AIDS.` },
    { q:`Which vascular endothelial skin cancer is a classic opportunistic malignancy strongly associated with advanced AIDS?`, options:[`Melanoma`,`Kaposi's Sarcoma`,`Squamous cell carcinoma`,`Basal cell carcinoma`], correct:1, explain:`Kaposi's Sarcoma, a vascular endothelial cancer linked to HHV-8, is a hallmark opportunistic malignancy of advanced AIDS.` },
    { q:`Which major route accounts for the majority of global HIV transmissions?`, options:[`Inhalation of aerosol droplets`,`Unprotected sexual intercourse and infected body fluids`,`Contaminated food and water`,`Mosquito vector bites`], correct:1, explain:`Unprotected sexual contact and exposure to infected blood/body fluids account for the majority of HIV transmissions worldwide.` },
    { q:`HIV CANNOT be transmitted through which of the following casual interactions?`, options:[`Blood transfusion`,`Sharing utensils, hugging, or shaking hands`,`Unsterilized surgical equipment`,`Mother to child during childbirth`], correct:1, explain:`HIV does not survive well outside the body and isn't spread through casual contact like sharing utensils, hugging, or shaking hands.` },
    { q:`Vertical transmission of HIV refers to transmission of the virus from:`, options:[`Patient to healthcare provider`,`Infected mother to fetus/infant during pregnancy, delivery, or breastfeeding`,`Animal vector to human`,`One sibling to another via casual contact`], correct:1, explain:`Vertical transmission refers to HIV passing from an infected mother to her fetus or infant during pregnancy, delivery, or breastfeeding.` },
    { q:`What standard initial screening laboratory test detects anti-HIV antibodies in human serum?`, options:[`PCR test`,`ELISA (Enzyme-Linked Immunosorbent Assay)`,`Gram stain`,`Widal test`], correct:1, explain:`ELISA is the standard initial screening test used to detect anti-HIV antibodies in serum.` },
    { q:`Which molecular diagnostic assay measures exact HIV viral load (copies of HIV RNA per mL of blood)?`, options:[`RT-PCR (Reverse Transcription Polymerase Chain Reaction)`,`Western Blot`,`ABO blood typing`,`Erythrocyte Sedimentation Rate (ESR)`], correct:0, explain:`RT-PCR quantifies the exact number of HIV RNA copies per mL of blood, giving the precise viral load.` },
    { q:`Antiretroviral Therapy (ART) cocktails combine drugs from multiple classes primarily to:`, options:[`Completely eliminate provirus from host genome`,`Suppress viral replication and prevent development of drug resistance`,`Destroy host CD4+ T-cells`,`Induce immediate lysis of all infected host cells`], correct:1, explain:`Combination ART suppresses viral replication and reduces the chance of the virus developing drug resistance.` },
    { q:`AZT (Azidothymidine / Zidovudine) is a famous antiretroviral drug that acts as a:`, options:[`Protease inhibitor`,`Nucleoside Reverse Transcriptase Inhibitor (NRTI)`,`Integrase inhibitor`,`Fusion inhibitor`], correct:1, explain:`AZT (Zidovudine) is a Nucleoside Reverse Transcriptase Inhibitor that blocks the reverse transcription step.` },
    { q:`Why is developing an effective, permanent vaccine against HIV uniquely difficult?`, options:[`The virus lacks a protein capsid`,`High mutation rate of Reverse Transcriptase causes rapid alteration of surface envelope antigens`,`HIV only infects bacterial host cells`,`Human body cannot produce antibodies against RNA viruses`], correct:1, explain:`Reverse transcriptase's high error rate drives rapid mutation of HIV's envelope antigens, making a durable vaccine extremely difficult to design.` },
    { q:`The "Window Period" in HIV infection refers to the time interval between:`, options:[`Lytic phase and lysogenic phase`,`Viral infection and detectable levels of anti-HIV antibodies in blood`,`Diagnosis of AIDS and death`,`Reverse transcription and integration`], correct:1, explain:`The window period is the interval after infection during which anti-HIV antibodies haven't yet reached detectable levels.` },
    { q:`Which of the following best describes the fundamental difference between HIV and AIDS?`, options:[`HIV is a bacterium, whereas AIDS is a viral infection`,`HIV is the causative viral pathogen, whereas AIDS is the advanced clinical syndrome`,`HIV affects red blood cells, whereas AIDS affects white blood cells`,`HIV is transmitted via air, whereas AIDS is transmitted via water`], correct:1, explain:`HIV is the virus that causes infection; AIDS is the advanced clinical syndrome that results from prolonged, untreated HIV infection.` },

  // ---- Chapter 2 · Bioenergetics · Respiration (Cellular Respiration) ----
  // 50 hand-authored, syllabus-accurate MCQs covering glycolysis, the link
  // reaction, the Krebs cycle, the electron transport chain / chemiosmosis,
  // and fermentation (from the PMDC MDCAT bioenergetics question set).
  'mdcat-bio-c2-t1': [
    { q:`Which of the following is the final electron acceptor in aerobic respiration?`, options:[`Water`,`NAD+`,`Oxygen`,`Cytochrome c`], correct:2, explain:`Oxygen is the terminal electron acceptor at Complex IV, where it's reduced to form water.` },
    { q:`In prokaryotes, where does glycolysis take place?`, options:[`Mitochondrial matrix`,`Cytoplasm`,`Cell membrane`,`Ribosome`], correct:1, explain:`Prokaryotes lack mitochondria, so glycolysis occurs in the cytoplasm — the same location as in eukaryotic cells.` },
    { q:`What is the net gain of ATP molecules produced directly from one molecule of glucose during glycolysis?`, options:[`2 ATP`,`4 ATP`,`36 ATP`,`38 ATP`], correct:0, explain:`Glycolysis produces 4 ATP by substrate-level phosphorylation but consumes 2 to start, for a net gain of 2 ATP.` },
    { q:`Which enzyme catalyzes the conversion of Fructose-6-phosphate to Fructose-1,6-bisphosphate?`, options:[`Hexokinase`,`Phosphofructokinase`,`Pyruvate kinase`,`Aldolase`], correct:1, explain:`Phosphofructokinase (PFK) catalyzes this key regulatory, rate-limiting step of glycolysis.` },
    { q:`The breakdown of a 6-carbon glucose into two 3-carbon pyruvate molecules is known as:`, options:[`Krebs Cycle`,`Oxidative Phosphorylation`,`Glycolysis`,`Calvin Cycle`], correct:2, explain:`Glycolysis is the pathway that splits one 6-carbon glucose into two 3-carbon pyruvate molecules.` },
    { q:`In the presence of oxygen, pyruvate enters the mitochondrion and undergoes oxidation to form:`, options:[`Lactate`,`Ethanol`,`Acetyl-CoA`,`Oxaloacetate`], correct:2, explain:`In the link reaction, pyruvate is oxidatively decarboxylated to form acetyl-CoA before entering the Krebs cycle.` },
    { q:`Which of the following processes produces carbon dioxide (CO2)?`, options:[`Glycolysis`,`Lactic Acid Fermentation`,`Link Reaction`,`Electron Transport Chain`], correct:2, explain:`The link reaction releases CO2 when pyruvate is decarboxylated to form acetyl-CoA.` },
    { q:`How many molecules of NADH are produced during one turn of the Krebs cycle?`, options:[`1`,`2`,`3`,`4`], correct:2, explain:`One turn of the Krebs cycle produces 3 NADH molecules (plus 1 FADH2 and 1 GTP/ATP).` },
    { q:`Which 4-carbon compound combines with Acetyl-CoA (2C) to initiate the Krebs cycle?`, options:[`Citrate`,`Oxaloacetate`,`α-Ketoglutarate`,`Succinate`], correct:1, explain:`Oxaloacetate (4C) condenses with acetyl-CoA (2C) to form citrate (6C), starting the Krebs cycle.` },
    { q:`The total ATP yield from the complete oxidation of one mole of glucose in eukaryotic cells is approximately:`, options:[`30–32 ATP`,`36–38 ATP`,`24–26 ATP`,`40–42 ATP`], correct:0, explain:`Modern estimates place the total yield at about 30–32 ATP per glucose, lower than the older textbook figure of 36–38 due to shuttle and transport costs.` },
    { q:`Where are the protein complexes of the Electron Transport Chain located in eukaryotes?`, options:[`Outer mitochondrial membrane`,`Mitochondrial matrix`,`Inner mitochondrial membrane`,`Intermembrane space`], correct:2, explain:`The ETC complexes are embedded in the inner mitochondrial membrane, where the proton gradient is generated.` },
    { q:`During chemiosmosis, protons (H+) move from the intermembrane space to the matrix through:`, options:[`Cytochrome c`,`ATP Synthase`,`Coenzyme Q`,`NADH Dehydrogenase`], correct:1, explain:`Protons flow back into the matrix through ATP synthase, and this flow drives ATP production.` },
    { q:`Lactic acid fermentation occurs in human muscle cells under:`, options:[`Aerobic conditions`,`Anaerobic conditions`,`High ATP concentration`,`Abundant oxygen availability`], correct:1, explain:`When oxygen is limited during intense exercise, muscle cells ferment pyruvate to lactate to keep glycolysis running.` },
    { q:`What is the primary purpose of fermentation under anaerobic conditions?`, options:[`To generate extra ATP`,`To regenerate NAD+ for glycolysis`,`To produce oxygen`,`To break down acetyl-CoA`], correct:1, explain:`Fermentation's main role is regenerating NAD+ from NADH so glycolysis can keep producing ATP without oxygen.` },
    { q:`Each molecule of FADH2 oxidation yields approximately how many ATP molecules via oxidative phosphorylation?`, options:[`1.5 ATP`,`2.5 ATP`,`3.0 ATP`,`4.0 ATP`], correct:0, explain:`FADH2 enters the ETC at Complex II, bypassing Complex I, so it yields a lower estimate of about 1.5 ATP compared to NADH's 2.5 ATP.` },
    { q:`Which complex of the electron transport chain receives electrons directly from FADH2?`, options:[`Complex I`,`Complex II`,`Complex III`,`Complex IV`], correct:1, explain:`FADH2 delivers its electrons to Complex II (succinate dehydrogenase), not Complex I.` },
    { q:`During the link reaction, pyruvate undergoes:`, options:[`Reduction and decarboxylation`,`Oxidation and decarboxylation`,`Phosphorylation and reduction`,`Hydration and oxidation`], correct:1, explain:`In the link reaction, pyruvate is both oxidized and decarboxylated (loses a CO2) to form acetyl-CoA.` },
    { q:`Which compound is the first stable product formed in the Krebs cycle?`, options:[`Oxaloacetate`,`Citrate`,`Isocitrate`,`Succinyl-CoA`], correct:1, explain:`Citrate is the first product formed when acetyl-CoA combines with oxaloacetate at the start of the cycle.` },
    { q:`Substrate-level phosphorylation during glycolysis involves the transfer of a phosphate group to ADP from:`, options:[`Free inorganic phosphate`,`High-energy substrate molecule`,`ATP Synthase`,`NADH`], correct:1, explain:`Substrate-level phosphorylation transfers a phosphate directly from a high-energy intermediate substrate to ADP, forming ATP.` },
    { q:`In alcoholic fermentation, pyruvate is first converted into:`, options:[`Lactate`,`Acetaldehyde`,`Ethanol`,`Acetyl-CoA`], correct:1, explain:`Pyruvate is first decarboxylated to acetaldehyde, which is then reduced to ethanol.` },
    { q:`Which enzyme is responsible for converting pyruvate into lactate during anaerobic respiration?`, options:[`Pyruvate decarboxylase`,`Lactate dehydrogenase`,`Alcohol dehydrogenase`,`Pyruvate kinase`], correct:1, explain:`Lactate dehydrogenase reduces pyruvate to lactate while oxidizing NADH back to NAD+.` },
    { q:`The pumping of protons across the inner mitochondrial membrane creates a gradient known as:`, options:[`Proton motive force`,`Osmotic pressure`,`Electron potential`,`Substrate gradient`], correct:0, explain:`The electrochemical proton gradient generated by pumping H+ across the membrane is called the proton motive force.` },
    { q:`Which cytochrome transfers electrons directly to oxygen in Complex IV?`, options:[`Cytochrome b`,`Cytochrome c1`,`Cytochrome a3`,`Cytochrome c`], correct:2, explain:`Cytochrome a3 within Complex IV is the site where electrons are finally passed directly to oxygen.` },
    { q:`How many decarboxylation steps occur in one turn of the Citric Acid Cycle?`, options:[`1`,`2`,`3`,`4`], correct:1, explain:`Two decarboxylation steps occur per turn of the Krebs cycle, releasing two CO2 molecules.` },
    { q:`Which of the following is an inhibitor of Complex IV (Cytochrome c oxidase) in the ETC?`, options:[`Rotenone`,`Antimycin A`,`Cyanide`,`Oligomycin`], correct:2, explain:`Cyanide blocks Complex IV (cytochrome c oxidase), preventing electrons from being passed to oxygen.` },
    { q:`The overall reaction of aerobic respiration is classified as:`, options:[`Anabolic and endergonic`,`Catabolic and exergonic`,`Anabolic and exergonic`,`Catabolic and endergonic`], correct:1, explain:`Respiration breaks down glucose (catabolic) and releases energy overall (exergonic).` },
    { q:`In human cells, how many total NADH molecules are produced from one glucose molecule through complete oxidation?`, options:[`2`,`6`,`8`,`10`], correct:3, explain:`Complete oxidation of one glucose yields 10 NADH total: 2 from glycolysis, 2 from the link reaction, and 6 from the Krebs cycle.` },
    { q:`Glycolysis is also known as:`, options:[`Calvin path`,`EMP pathway`,`HMP shunt`,`TCA cycle`], correct:1, explain:`Glycolysis is also called the EMP (Embden-Meyerhof-Parnas) pathway, named after its discoverers.` },
    { q:`What is the site of the Krebs cycle in eukaryotic cells?`, options:[`Cytosol`,`Mitochondrial matrix`,`Cristae`,`Peroxisome`], correct:1, explain:`The Krebs cycle enzymes are located in the mitochondrial matrix.` },
    { q:`During glycolysis, cleavage of Fructose-1,6-bisphosphate yields two 3-carbon sugars:`, options:[`G3P and DHAP`,`Pyruvate and Lactate`,`G3P and PEP`,`3-PGA and 2-PGA`], correct:0, explain:`Aldolase splits fructose-1,6-bisphosphate into glyceraldehyde-3-phosphate (G3P) and dihydroxyacetone phosphate (DHAP), which is then converted to G3P as well.` },
    { q:`Which compound is oxidized by Complex I of the respiratory chain?`, options:[`FADH2`,`NADH`,`Succinate`,`Ubiquinone`], correct:1, explain:`Complex I (NADH dehydrogenase) oxidizes NADH, passing its electrons into the chain.` },
    { q:`The enzyme ATP Synthase consists of two main components, F0 and F1. Where is F0 located?`, options:[`In the matrix`,`Embedded in the inner membrane`,`In the intermembrane space`,`On the outer membrane`], correct:1, explain:`The F0 portion is embedded within the inner mitochondrial membrane and forms the proton channel; F1 projects into the matrix and synthesizes ATP.` },
    { q:`Which molecule acts as a mobile electron carrier between Complex III and Complex IV?`, options:[`Coenzyme Q`,`Cytochrome c`,`NAD+`,`FAD`], correct:1, explain:`Cytochrome c shuttles electrons from Complex III to Complex IV along the outer face of the inner membrane.` },
    { q:`In eukaryotic cells, the glycerol phosphate shuttle transfers electrons from cytosolic NADH to yield:`, options:[`3 ATP per NADH`,`2 ATP per NADH (or 1.5 ATP)`,`38 ATP total`,`Direct GTP`], correct:1, explain:`The glycerol phosphate shuttle hands electrons to FAD in the mitochondria, yielding only about 1.5–2 ATP per cytosolic NADH instead of the usual 2.5.` },
    { q:`Phosphoenolpyruvate (PEP) is converted into pyruvate by which enzyme?`, options:[`Enolase`,`Phosphoglycerate mutase`,`Pyruvate kinase`,`Phosphofructokinase`], correct:2, explain:`Pyruvate kinase catalyzes the final step of glycolysis, transferring a phosphate from PEP to ADP to form pyruvate and ATP.` },
    { q:`How many oxygen molecules (O2) are directly consumed per glucose molecule in aerobic respiration?`, options:[`1`,`3`,`6`,`12`], correct:2, explain:`Complete aerobic oxidation of one glucose molecule consumes 6 molecules of O2, matching the 6 CO2 released.` },
    { q:`Succinate is oxidized to fumarate in the Krebs cycle with the simultaneous reduction of:`, options:[`NAD+ to NADH`,`FAD to FADH2`,`NADP+ to NADPH`,`GDP to GTP`], correct:1, explain:`Succinate dehydrogenase reduces FAD to FADH2 while oxidizing succinate to fumarate.` },
    { q:`The process of direct synthesis of ATP from ADP and inorganic phosphate using energy from electron transport is called:`, options:[`Substrate-level phosphorylation`,`Oxidative phosphorylation`,`Photophosphorylation`,`Decarboxylation`], correct:1, explain:`Oxidative phosphorylation uses the energy released by electron transport (via the proton gradient) to drive ATP synthase.` },
    { q:`Which of the following is NOT produced during glycolysis?`, options:[`ATP`,`NADH`,`Pyruvate`,`CO2`], correct:3, explain:`Glycolysis produces ATP, NADH, and pyruvate, but no CO2 is released — that happens later, in the link reaction and Krebs cycle.` },
    { q:`What is the net ATP yield per glucose molecule during lactic acid fermentation?`, options:[`0 ATP`,`2 ATP`,`4 ATP`,`36 ATP`], correct:1, explain:`Fermentation only regenerates NAD+ for glycolysis to continue — the net ATP yield remains the 2 ATP produced by glycolysis itself.` },
    { q:`Which form of energy is stored across the inner mitochondrial membrane during electron transport?`, options:[`Chemical energy`,`Electrochemical proton gradient`,`Thermal energy`,`Kinetic energy`], correct:1, explain:`Electron transport stores energy as an electrochemical proton gradient (proton motive force) across the inner membrane.` },
    { q:`The conversion of α-ketoglutarate to succinyl-CoA produces:`, options:[`NADH and CO2`,`FADH2 and CO2`,`ATP and H2O`,`NADPH and O2`], correct:0, explain:`This oxidative decarboxylation step releases CO2 and reduces NAD+ to NADH.` },
    { q:`Under aerobic conditions, what is the fate of the NADH generated during glycolysis?`, options:[`Used to reduce pyruvate to lactate`,`Transported to mitochondria for oxidative phosphorylation`,`Converted to FADH2 in the cytoplasm`,`Excreted from the cell`], correct:1, explain:`With oxygen present, cytosolic NADH is shuttled into the mitochondria to feed the electron transport chain rather than being used for fermentation.` },
    { q:`Which of the following enzymes catalyzes the phosphorylation of glucose in the first step of glycolysis?`, options:[`Phosphoglucomutase`,`Hexokinase`,`Aldolase`,`Triose phosphate isomerase`], correct:1, explain:`Hexokinase catalyzes the first step of glycolysis, phosphorylating glucose to glucose-6-phosphate using ATP.` },
    { q:`Where do protons accumulate during the electron transport chain in mitochondria?`, options:[`Mitochondrial matrix`,`Intermembrane space`,`Cytosol`,`Outer membrane space`], correct:1, explain:`Protons are pumped out of the matrix and accumulate in the intermembrane space, building the gradient used by ATP synthase.` },
    { q:`GTP produced during the Krebs cycle is converted to ATP by substrate-level phosphorylation via:`, options:[`Nucleoside diphosphate kinase`,`Succinate dehydrogenase`,`Aconitase`,`Fumarase`], correct:0, explain:`Nucleoside diphosphate kinase transfers a phosphate from GTP to ADP, forming ATP.` },
    { q:`Which of the following is a 5-carbon intermediate in the Krebs cycle?`, options:[`Citrate`,`Isocitrate`,`α-Ketoglutarate`,`Oxaloacetate`], correct:2, explain:`α-Ketoglutarate is the 5-carbon intermediate formed after the first decarboxylation step of the Krebs cycle.` },
    { q:`During severe physical exercise, oxygen debt is created due to the accumulation of:`, options:[`Ethanol`,`Pyruvate`,`Lactic acid`,`Carbon dioxide`], correct:2, explain:`When oxygen supply can't keep pace with demand, lactic acid builds up in muscles, creating an oxygen debt that must later be repaid.` },
    { q:`Which statement about the Krebs cycle is TRUE?`, options:[`It occurs in the cytoplasm.`,`It produces 2 ATP (or GTP) per glucose molecule directly.`,`It consumes molecular oxygen directly in its steps.`,`It does not produce CO2.`], correct:1, explain:`The Krebs cycle directly generates 2 GTP/ATP per glucose (one per turn, two turns per glucose) via substrate-level phosphorylation; it doesn't use O2 directly, and it does release CO2.` },
    { q:`What is the primary role of NAD+ and FAD in cellular respiration?`, options:[`High-energy fuel source`,`Coenzymes acting as electron carriers`,`Structural components of membranes`,`Enzymes that synthesize ATP`], correct:1, explain:`NAD+ and FAD are coenzymes that shuttle electrons (as NADH and FADH2) from glycolysis and the Krebs cycle to the electron transport chain.` },
  ],

  // ---- Chapter 3 · Biological Molecules · Biological Molecules (Definition and Classification) ----
  // 50 hand-authored, syllabus-accurate MCQs giving a broad overview across
  // carbohydrates, proteins, lipids, and nucleic acids (from the PMDC MDCAT
  // biological molecules question set).
  'mdcat-bio-c3-t1': [
    { q:`Which of the following is defined as a polyhydroxy aldehyde or ketone?`, options:[`Lipid`,`Carbohydrate`,`Protein`,`Nucleic Acid`], correct:1, explain:`Carbohydrates are chemically defined as polyhydroxy aldehydes (aldoses) or polyhydroxy ketones (ketoses).` },
    { q:`Which monosaccharide is commonly known as fruit sugar?`, options:[`Glucose`,`Fructose`,`Galactose`,`Ribose`], correct:1, explain:`Fructose, abundant in fruits and honey, is commonly called fruit sugar.` },
    { q:`Maltose is a disaccharide composed of which two monosaccharide units?`, options:[`Glucose + Fructose`,`Glucose + Galactose`,`Glucose + Glucose`,`Fructose + Galactose`], correct:2, explain:`Maltose forms from two glucose units joined by a glycosidic bond.` },
    { q:`Which covalent bond joins amino acids together to form proteins?`, options:[`Glycosidic bond`,`Phosphodiester bond`,`Peptide bond`,`Ester bond`], correct:2, explain:`Amino acids are linked by peptide bonds, formed between the carboxyl group of one and the amino group of the next.` },
    { q:`Which of the following is an example of a structural polysaccharide in plants?`, options:[`Starch`,`Glycogen`,`Cellulose`,`Inulin`], correct:2, explain:`Cellulose forms the structural fibers of plant cell walls, unlike starch and glycogen, which are storage polysaccharides.` },
    { q:`Lipids are defined as biological molecules that are characteristically:`, options:[`Insoluble in organic solvents`,`Soluble in water`,`Hydrophobic and soluble in non-polar solvents`,`Polymers of nucleotides`], correct:2, explain:`Lipids are hydrophobic molecules that dissolve in non-polar (organic) solvents rather than in water.` },
    { q:`Which of the following is an example of a conjugated protein?`, options:[`Collagen`,`Hemoglobin`,`Keratin`,`Insulin`], correct:1, explain:`Hemoglobin is a conjugated protein — it combines a polypeptide (globin) with a non-protein heme group.` },
    { q:`In DNA, the nitrogenous base Adenine pairs with Thymine via how many hydrogen bonds?`, options:[`1`,`2`,`3`,`4`], correct:1, explain:`Adenine and Thymine pair through 2 hydrogen bonds, while Guanine and Cytosine pair through 3.` },
    { q:`Which molecule serves as the main storage polysaccharide in animals?`, options:[`Starch`,`Cellulose`,`Glycogen`,`Chitin`], correct:2, explain:`Glycogen is the primary storage polysaccharide in animals, stored mainly in liver and muscle.` },
    { q:`An amino acid contains which two functional groups attached to the central alpha carbon?`, options:[`Carboxyl and Hydroxyl`,`Amino and Carboxyl`,`Carbonyl and Amino`,`Hydroxyl and Methyl`], correct:1, explain:`Every amino acid has an amino group and a carboxyl group attached to its central (alpha) carbon.` },
    { q:`Which of the following is a keto-hexose sugar?`, options:[`Glucose`,`Fructose`,`Galactose`,`Ribose`], correct:1, explain:`Fructose is a 6-carbon sugar with a ketone functional group, making it a keto-hexose; glucose and galactose are aldo-hexoses.` },
    { q:`Sucrose is formed by a glycosidic linkage between:`, options:[`α-D-glucose and β-D-fructose`,`Glucose and Galactose`,`Two α-D-glucose units`,`Two β-D-galactose units`], correct:0, explain:`Sucrose (table sugar) is formed from a glycosidic bond between α-D-glucose and β-D-fructose.` },
    { q:`Triglycerides are esters derived from glycerol and how many fatty acid molecules?`, options:[`1`,`2`,`3`,`4`], correct:2, explain:`A triglyceride consists of one glycerol backbone esterified to three fatty acid chains.` },
    { q:`Which lipid type forms the structural backbone of biological membranes?`, options:[`Triacylglycerols`,`Phospholipids`,`Waxes`,`Terpenoids`], correct:1, explain:`Phospholipids, with their hydrophilic heads and hydrophobic tails, self-assemble into the bilayers that form cell membranes.` },
    { q:`Chitin is a structural polysaccharide found in fungal cell walls and insect exoskeletons made of repeating units of:`, options:[`N-acetylglucosamine`,`Glucose-1-phosphate`,`Galactosamine`,`Glucuronic acid`], correct:0, explain:`Chitin is a polymer of repeating N-acetylglucosamine units.` },
    { q:`Which of the following is a fibrous, water-insoluble protein?`, options:[`Hemoglobin`,`Keratin`,`Myoglobin`,`Enzymes`], correct:1, explain:`Keratin is a fibrous, water-insoluble structural protein found in hair, nails, and skin, unlike globular proteins like hemoglobin.` },
    { q:`A nucleotide consists of which three components?`, options:[`Pentose sugar, Nitrogenous base, Phosphate group`,`Hexose sugar, Amino acid, Fatty acid`,`Pentose sugar, Purine, Glycerol`,`Nitrogenous base, Phosphate, Amino acid`], correct:0, explain:`Every nucleotide is built from a pentose sugar, a nitrogenous base, and one or more phosphate groups.` },
    { q:`Which purine base is present in RNA but substituted by Thymine in DNA?`, options:[`Guanine`,`Uracil`,`Cytosine`,`Adenine`], correct:1, explain:`RNA uses uracil in place of DNA's thymine; note that uracil is actually a pyrimidine, not a purine, and directly replaces thymine's pairing role with adenine.` },
    { q:`Saturated fatty acids contain:`, options:[`Only single carbon-carbon bonds`,`One double carbon-carbon bond`,`Multiple double carbon-carbon bonds`,`Triple carbon-carbon bonds`], correct:0, explain:`Saturated fatty acids have only single bonds between their carbon atoms, allowing them to pack tightly and remain solid at room temperature.` },
    { q:`Which level of protein structure is characterized by α-helices and β-pleated sheets?`, options:[`Primary structure`,`Secondary structure`,`Tertiary structure`,`Quaternary structure`], correct:1, explain:`Secondary structure describes the local folding patterns — α-helices and β-pleated sheets — stabilized by hydrogen bonds.` },
    { q:`Phosphodiester bonds link which components in a nucleic acid chain?`, options:[`Amino acid R-groups`,`Sugar of one nucleotide to phosphate of another`,`Nitrogenous bases together`,`Glycerol to fatty acids`], correct:1, explain:`Phosphodiester bonds connect the sugar of one nucleotide to the phosphate group of the adjacent nucleotide, forming the nucleic acid backbone.` },
    { q:`Which of the following is an example of a monomeric globular protein?`, options:[`Hemoglobin`,`Myoglobin`,`Collagen`,`Fibroin`], correct:1, explain:`Myoglobin is a single-chain (monomeric) globular protein, unlike hemoglobin which has four subunits.` },
    { q:`Which polysaccharide gives a blue color with iodine solution?`, options:[`Glycogen`,`Starch`,`Cellulose`,`Chitin`], correct:1, explain:`Starch's helical amylose structure traps iodine molecules, producing a characteristic deep blue-black color.` },
    { q:`Waxes are esters formed between long-chain fatty acids and:`, options:[`Glycerol`,`Long-chain alcohols`,`Phosphoric acid`,`Amino acids`], correct:1, explain:`Unlike triglycerides, waxes are esters of long-chain fatty acids with long-chain alcohols rather than glycerol.` },
    { q:`Which amino acid is simplest in structure, having Hydrogen as its R-group?`, options:[`Alanine`,`Glycine`,`Valine`,`Leucine`], correct:1, explain:`Glycine is the simplest amino acid, with a single hydrogen atom as its side chain (R-group).` },
    { q:`In proteins, disulfide bridges are formed between the side chains of which amino acid?`, options:[`Methionine`,`Cysteine`,`Lysine`,`Proline`], correct:1, explain:`Cysteine residues form disulfide bridges through their sulfhydryl (-SH) side chains, stabilizing tertiary and quaternary protein structure.` },
    { q:`Which carbohydrate is known as table sugar?`, options:[`Lactose`,`Maltose`,`Sucrose`,`Cellobiose`], correct:2, explain:`Sucrose, made of glucose and fructose, is the common table sugar extracted from sugarcane or sugar beet.` },
    { q:`Lactose is a disaccharide composed of:`, options:[`Glucose + Fructose`,`Glucose + Galactose`,`Galactose + Fructose`,`Glucose + Glucose`], correct:1, explain:`Lactose, the sugar found in milk, is formed from glucose and galactose.` },
    { q:`Which lipid class includes cholesterol, estrogen, and testosterone?`, options:[`Phospholipids`,`Steroids`,`Triglycerides`,`Waxes`], correct:1, explain:`Cholesterol and the sex hormones estrogen and testosterone all belong to the steroid class of lipids, built on a four-ring carbon skeleton.` },
    { q:`What is the principal role of mRNA in the cell?`, options:[`Carries amino acids to ribosomes`,`Carries genetic code from DNA to ribosomes`,`Forms structural subunit of ribosome`,`Catalyzes peptide bond formation`], correct:1, explain:`Messenger RNA (mRNA) carries the genetic code transcribed from DNA to the ribosomes for translation into protein.` },
    { q:`Which property of water allows it to act as an effective temperature buffer in biological systems?`, options:[`High heat capacity`,`Low viscosity`,`High density at 4°C`,`Non-polar nature`], correct:0, explain:`Water's high specific heat capacity means it absorbs or releases a lot of heat with only a small temperature change, buffering organisms against thermal swings.` },
    { q:`Which type of linkage connects fatty acids to glycerol in a triglyceride?`, options:[`Glycosidic bond`,`Ester bond`,`Peptide bond`,`Amide bond`], correct:1, explain:`Fatty acids attach to glycerol through ester bonds, formed by condensation reactions that release water.` },
    { q:`Which nitrogenous base is a pyrimidine?`, options:[`Adenine`,`Guanine`,`Cytosine`,`Hypoxanthine`], correct:2, explain:`Cytosine is a single-ringed pyrimidine base, along with thymine and uracil; adenine and guanine are the double-ringed purines.` },
    { q:`Secondary structure of proteins is primarily stabilized by:`, options:[`Disulfide bonds`,`Ionic bonds`,`Hydrogen bonds`,`Hydrophobic interactions`], correct:2, explain:`Hydrogen bonds between backbone atoms hold α-helices and β-pleated sheets in place, defining secondary structure.` },
    { q:`Which of the following is an aldopentose sugar essential for RNA?`, options:[`Ribose`,`Deoxyribose`,`Ribulose`,`Xylulose`], correct:0, explain:`Ribose, a 5-carbon aldose sugar, forms the backbone sugar of RNA nucleotides.` },
    { q:`The overall 3D folded conformation of a single polypeptide chain is its:`, options:[`Primary structure`,`Secondary structure`,`Tertiary structure`,`Quaternary structure`], correct:2, explain:`Tertiary structure describes the complete three-dimensional folding of a single polypeptide chain.` },
    { q:`Which of the following is a non-reducing disaccharide?`, options:[`Maltose`,`Lactose`,`Sucrose`,`Cellobiose`], correct:2, explain:`Sucrose is non-reducing because both anomeric carbons of its glucose and fructose units are involved in the glycosidic bond, leaving no free reactive aldehyde/ketone group.` },
    { q:`What is the storage form of carbohydrate in human liver and muscle tissue?`, options:[`Starch`,`Glycogen`,`Inulin`,`Dextrin`], correct:1, explain:`Glycogen is the carbohydrate storage form found in human liver and muscle tissue.` },
    { q:`Lipids yield how much energy per gram compared to carbohydrates?`, options:[`Half as much`,`Equal amount`,`Twice as much (~9 kcal/g)`,`Four times as much`], correct:2, explain:`Lipids yield roughly 9 kcal/g, about twice the ~4 kcal/g yielded by carbohydrates, due to their more reduced (less oxidized) carbon-hydrogen bonds.` },
    { q:`Which protein structural level is illustrated by hemoglobin's four subunit assembly?`, options:[`Primary`,`Secondary`,`Tertiary`,`Quaternary`], correct:3, explain:`Quaternary structure describes the arrangement of multiple polypeptide subunits, as seen in hemoglobin's four-chain assembly.` },
    { q:`Which molecule acts as the primary energy currency of the cell?`, options:[`DNA`,`NADH`,`ATP`,`cAMP`], correct:2, explain:`ATP is the cell's primary energy currency, its terminal phosphate bond releasing usable energy when hydrolyzed.` },
    { q:`Unsaturated fatty acids generally have lower melting points because of:`, options:[`Kinks caused by double bonds`,`Longer carbon chains`,`Saturated hydrocarbon tails`,`Stronger van der Waals forces`], correct:0, explain:`Double bonds introduce kinks in unsaturated fatty acid tails, preventing tight packing and lowering their melting point compared to saturated fats.` },
    { q:`Which biomolecule is defined as a polymer of nucleotide monomers?`, options:[`Lipid`,`Nucleic Acid`,`Polysaccharide`,`Proteoglycan`], correct:1, explain:`Nucleic acids (DNA and RNA) are polymers built from repeating nucleotide monomer units.` },
    { q:`Which enzyme class catalyzes the breakdown of lipids into glycerol and fatty acids?`, options:[`Amylases`,`Lipases`,`Proteases`,`Nucleases`], correct:1, explain:`Lipases hydrolyze the ester bonds in lipids, breaking them down into glycerol and free fatty acids.` },
    { q:`Which of the following is an example of a glycoprotein?`, options:[`Casein`,`Mucin`,`Lipovitellin`,`Chromatin`], correct:1, explain:`Mucin is a glycoprotein — a protein with covalently attached carbohydrate groups — found in mucus secretions.` },
    { q:`The heat of vaporization of water is high due to extensive:`, options:[`Covalent bonding`,`Hydrogen bonding`,`Ionic interaction`,`Van der Waals forces`], correct:1, explain:`Water's extensive hydrogen bonding network requires a large energy input to break during the liquid-to-gas transition, giving it a high heat of vaporization.` },
    { q:`Which test is used to detect the presence of reducing sugars?`, options:[`Biuret test`,`Benedict's test`,`Iodine test`,`Sudan IV test`], correct:1, explain:`Benedict's test detects reducing sugars, indicated by a color change to brick-red on heating with Benedict's reagent.` },
    { q:`Which lipid is classified as a terpenoid derived from isoprene units?`, options:[`Carotenoids`,`Phosphatidylcholine`,`Sphingomyelin`,`Stearic acid`], correct:0, explain:`Carotenoids are terpenoid lipids built from repeating five-carbon isoprene units.` },
    { q:`The primary structure of a protein is determined by the sequence of amino acids held by:`, options:[`Hydrogen bonds`,`Peptide bonds`,`Ionic bonds`,`Hydrophobic interactions`], correct:1, explain:`Primary structure is simply the linear sequence of amino acids linked by peptide bonds.` },
    { q:`Which nucleic acid carries the specific anticodon sequence during translation?`, options:[`mRNA`,`tRNA`,`rRNA`,`snRNA`], correct:1, explain:`Transfer RNA (tRNA) carries the anticodon that pairs with mRNA codons, delivering the correct amino acid during translation.` },
