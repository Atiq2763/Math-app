<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Test Prep App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .content {
    flex: 1;
    padding: 16px;
    padding-bottom: 80px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  h1 { font-size: 20px; color: #333; margin-top: 8px; }
  h2 { font-size: 17px; color: #333; line-height: 1.4; }

  .course-card {
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .course-info { flex: 1; cursor: pointer; }
  .course-name { font-weight: bold; font-size: 16px; color: #333; }
  .course-sub { font-size: 13px; color: #666; margin-top: 3px; }
  .course-actions { display: flex; gap: 8px; margin-left: 10px; }
  .icon-btn {
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn.active { background: #fee2e2; border-color: #dc2626; }
  .icon-btn.added { background: #d1fae5; border-color: #059669; }

  .subject-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .subject-btn:hover { border-color: #4f46e5; }
  .subject-name { font-weight: bold; font-size: 15px; color: #333; }
  .subject-stats { font-size: 13px; color: #666; margin-top: 4px; }
  .mastered-badge { display: inline-block; background: #d1fae5; color: #059669; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .soon-badge { display: inline-block; background: #fef3c7; color: #b45309; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }

  .card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
  }

  #topic { font-size: 12px; color: #4f46e5; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
  #progress { font-size: 13px; color: #666; margin-bottom: 6px; }

  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 15px;
    cursor: pointer;
    color: #333;
  }
  .option-btn:hover { border-color: #4f46e5; background: #eef2ff; }
  .option-btn.correct { border-color: #059669; background: #d1fae5; color: #047857; }
  .option-btn.wrong { border-color: #dc2626; background: #fee2e2; color: #b91c1c; }
  .option-btn:disabled { cursor: default; }

  button.action {
    display: block;
    width: 100%;
    margin: 14px auto 0;
    padding: 12px 20px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  button.action:hover { background: #4338ca; }
  .back-btn { background: #6b7280; }
  .back-btn:hover { background: #4b5563; }
  .next-btn { background: #059669; }
  .next-btn:hover { background: #047857; }

  #result { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 20px; }
  .hidden { display: none; }
  .bonus-tag { color: #d97706; font-size: 12px; font-weight: bold; }
  .empty-msg { color: #999; font-size: 14px; text-align: center; margin-top: 30px; }

  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #e5e7eb;
    display: flex;
    max-width: 480px;
    margin: 0 auto;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 4px 10px;
    font-size: 12px;
    color: #999;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tab-btn .tab-icon { font-size: 20px; }
  .tab-btn.active { color: #4f46e5; font-weight: bold; }
.auth-screen {
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 20px;
}
.auth-card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.auth-card h1 { text-align: center; margin-bottom: 20px; }
.auth-input {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  margin-bottom: 12px;
}
.auth-error {
  color: #dc2626;
  font-size: 13px;
  text-align: center;
  min-height: 18px;
  margin-bottom: 8px;
}
.auth-switch {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-top: 14px;
}
.auth-switch a { color: #4f46e5; cursor: pointer; font-weight: bold; }
.logout-btn {
  background: #f9fafb;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  cursor: pointer;
  float: right;
  margin-bottom: 10px;
}
</style>
</head>
<body>

 <div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1 id="authTitle">Log In</h1>
    <p class="auth-error" id="authError"></p>
    <input type="email" id="authEmail" class="auth-input" placeholder="Email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Password">
    <button class="action" id="authSubmitBtn" onclick="handleAuthSubmit()">Log In</button>
    <p class="auth-switch" id="authSwitchText">
      Don't have an account? <a onclick="toggleAuthMode()">Sign Up</a>
    </p>
  </div>
</div>

<div id="appScreen" class="hidden">
<button class="logout-btn" onclick="handleLogout()">Log Out</button>
 <div class="content" id="mainContent"></div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabFav" onclick="switchTab('favourites')">
      <span class="tab-icon">★</span> Favourites
    </button>
    <button class="tab-btn" id="tabMy" onclick="switchTab('mycourses')">
      <span class="tab-icon">📘</span> My Courses
    </button>
    <button class="tab-btn" id="tabAll" onclick="switchTab('all')">
      <span class="tab-icon">🗂️</span> Total Courses
    </button>
  </div>
  </div>

<script>
  var courses = {
    mdcat: {
      label: "MDCAT",
      subjects: {
        biology:  { label: "Biology" },
        physics:  { label: "Physics" },
        chemistry:{ label: "Chemistry" },
        logical:  { label: "Logical Reasoning" },
        english:  { label: "English" }
      }
    },
    sat: {
      label: "SAT",
      subjects: {
        math:    { label: "Mathematics" },
        english: { label: "English" }
      }
    },
    fast: {
      label: "FAST-NUCES Entry Test",
      subjects: {
        math: { label: "Mathematics" },
        english: { label: "English" },
        iq: { label: "IQ / Analytical" }
      }
    },
    nust: {
      label: "NUST Entry Test (NET)",
      subjects: {
        math: { label: "Mathematics" },
        physics: { label: "Physics" },
        chemistry: { label: "Chemistry" },
        english: { label: "English" }
      }
    },
    iba: {
      label: "IBA Entry Test",
      subjects: {
        math: { label: "Mathematics" },
        english: { label: "English" },
        analytical: { label: "Analytical Reasoning" }
      }
    }
  };

  var favourites = {};
  var myCourses = {};
  var subjectMastery = {};

  var currentTab = "favourites";
  var currentCourse = null;
  var currentSubject = null;

  var questionBanks = {
    biology: [
      { q: "Which organelle is known as the 'powerhouse of the cell'?", a: "Mitochondria", options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi apparatus"] },
      { q: "What is the basic structural unit of life?", a: "Cell", options: ["Cell", "Tissue", "Organ", "Atom"] },
      { q: "DNA is found mainly inside which cell structure?", a: "Nucleus", options: ["Nucleus", "Cytoplasm", "Cell wall", "Vacuole"] },
      { q: "Which blood cells are responsible for carrying oxygen?", a: "Red blood cells", options: ["White blood cells", "Red blood cells", "Platelets", "Plasma"] },
      { q: "Photosynthesis mainly occurs in which organelle?", a: "Chloroplast", options: ["Mitochondria", "Chloroplast", "Nucleus", "Ribosome"] }
    ],
    math: [
      { q: "Solve for x: 2x + 3 = 11", a: "4", options: ["3", "4", "5", "7"] },
      { q: "What is 15% of 200?", a: "30", options: ["20", "25", "30", "35"] },
      { q: "If a triangle has angles 60° and 70°, what is the third angle?", a: "50°", options: ["40°", "50°", "60°", "70°"] },
      { q: "What is the value of 7²?", a: "49", options: ["14", "36", "49", "56"] },
      { q: "Simplify: 3(x + 2)", a: "3x + 6", options: ["3x + 2", "3x + 6", "x + 6", "3x + 5"] }
    ]
  };

  function switchTab(tab) {
    currentTab = tab;
    currentCourse = null;
    currentSubject = null;

    document.getElementById("tabFav").classList.toggle("active", tab === "favourites");
    document.getElementById("tabMy").classList.toggle("active", tab === "mycourses");
    document.getElementById("tabAll").classList.toggle("active", tab === "all");

    renderCourseList();
  }

  function renderCourseList() {
    var container = document.getElementById("mainContent");
    var html = "<h1>" + tabTitle() + "</h1>";

    var keysToShow = [];
    for (var key in courses) {
      if (currentTab === "all") { keysToShow.push(key); }
      else if (currentTab === "favourites" && favourites[key]) { keysToShow.push(key); }
      else if (currentTab === "mycourses" && myCourses[key]) { keysToShow.push(key); }
    }

    if (keysToShow.length === 0) {
      html += '<p class="empty-msg">' + emptyMessage() + '</p>';
      container.innerHTML = html;
      return;
    }

    container.innerHTML = html;

    for (var i = 0; i < keysToShow.length; i++) {
      var key = keysToShow[i];
      var c = courses[key];
      var subjectCount = Object.keys(c.subjects).length;

      var card = document.createElement("div");
      card.className = "course-card";

      var info = document.createElement("div");
      info.className = "course-info";
      info.innerHTML = '<div class="course-name">' + c.label + '</div><div class="course-sub">' + subjectCount + ' subjects</div>';
      info.onclick = (function(k) { return function() { openCourse(k); }; })(key);

      var actions = document.createElement("div");
      actions.className = "course-actions";

      var favBtn = document.createElement("button");
      favBtn.className = "icon-btn" + (favourites[key] ? " active" : "");
      favBtn.innerHTML = "★";
      favBtn.onclick = (function(k) { return function(e) { e.stopPropagation(); toggleFavourite(k); }; })(key);

      var addBtn = document.createElement("button");
      addBtn.className = "icon-btn" + (myCourses[key] ? " added" : "");
      addBtn.innerHTML = myCourses[key] ? "✓" : "+";
      addBtn.onclick = (function(k) { return function(e) { e.stopPropagation(); toggleMyCourse(k); }; })(key);

      actions.appendChild(favBtn);
      actions.appendChild(addBtn);
      card.appendChild(info);
      card.appendChild(actions);
      container.appendChild(card);
    }
  }

  function tabTitle() {
    if (currentTab === "favourites") return "★ Favourites";
    if (currentTab === "mycourses") return "📘 My Courses";
    return "🗂️ Total Courses";
  }

  function emptyMessage() {
    if (currentTab === "favourites") return "No favourites yet. Tap ★ on any course to add it here.";
    if (currentTab === "mycourses") return "You haven't added any courses yet. Tap + on any course to add it here.";
    return "No courses available.";
  }

  function toggleFavourite(key) {
    favourites[key] = !favourites[key];
    renderCourseList();
  }

  function toggleMyCourse(key) {
    myCourses[key] = !myCourses[key];
    renderCourseList();
  }

  function openCourse(key) {
    currentCourse = key;
    var container = document.getElementById("mainContent");
    var c = courses[key];

    var html = '<button class="action back-btn" onclick="renderCourseList()" style="margin-bottom:16px;">← Back</button>';
    html += "<h1>" + c.label + "</h1>";
    container.innerHTML = html;

    for (var subKey in c.subjects) {
      var s = c.subjects[subKey];
      var hasQuestions = questionBanks[subKey] !== undefined;
      var badge = subjectMastery[subKey] ? '<span class="mastered-badge">MASTERED</span>' : (!hasQuestions ? '<span class="soon-badge">COMING SOON</span>' : '');

      var btn = document.createElement("button");
      btn.className = "subject-btn";
      btn.innerHTML = '<div class="subject-name">' + s.label + badge + '</div>' +
        '<div class="subject-stats">' + (hasQuestions ? (subjectMastery[subKey] ? "Completed" : "Tap to practice") : "Question bank not added yet") + '</div>';

      if (hasQuestions) {
        btn.onclick = (function(sk) { return function() { startSubject(sk); }; })(subKey);
      } else {
        btn.style.opacity = "0.6";
      }

      container.appendChild(btn);
    }
  }

  var correctAnswer, questionQueue = [], currentIndex = 0, masteryFailed = false, answered = false;

  function startSubject(subKey) {
    currentSubject = subKey;
    questionQueue = [];
    currentIndex = 0;
    masteryFailed = false;

    var bank = questionBanks[subKey].slice();
    shuffle(bank);
    var count = Math.min(5, bank.length);
    for (var i = 0; i < count; i++) {
      questionQueue.push(makeQuestionObj(bank[i], false));
    }

    renderPracticeScreen();
    showCurrentQuestion();
  }

  function renderPracticeScreen() {
    var container = document.getElementById("mainContent");
    container.innerHTML =
      '<div class="card">' +
      '<p id="progress"></p>' +
      '<p id="topic"></p>' +
      '<h2 id="question">Loading...</h2>' +
      '<div id="optionsList"></div>' +
      '<p id="result"></p>' +
      '<button class="action next-btn hidden" id="nextBtn" onclick="goToNext()">Next</button>' +
      '<button class="action back-btn" onclick="openCourse(currentCourse)">Back to Subjects</button>' +
      '</div>';
  }

  function makeQuestionObj(bankItem, isBonus) {
    var opts = bankItem.options.slice();
    shuffle(opts);
    return { text: bankItem.q, answer: bankItem.a, options: opts, isBonus: isBonus };
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }

  function pickBonusQuestion() {
    var bank = questionBanks[currentSubject];
    var picked = bank[Math.floor(Math.random() * bank.length)];
    return makeQuestionObj(picked, true);
  }

  function showCurrentQuestion() {
    var q = questionQueue[currentIndex];
    correctAnswer = q.answer;
    answered = false;

    var progressText = "Question " + (currentIndex + 1) + " of " + questionQueue.length;
    if (q.isBonus) progressText += ' <span class="bonus-tag">— BONUS</span>';

    document.getElementById("progress").innerHTML = progressText;
    document.getElementById("topic").innerHTML = courses[currentCourse].subjects[currentSubject].label;
    document.getElementById("question").innerHTML = q.text;
    document.getElementById("result").innerHTML = "";
    document.getElementById("nextBtn").classList.add("hidden");

    var optionsList = document.getElementById("optionsList");
    optionsList.innerHTML = "";

    for (var i = 0; i < q.options.length; i++) {
      var optBtn = document.createElement("button");
      optBtn.className = "option-btn";
      optBtn.innerHTML = q.options[i];
      optBtn.onclick = (function(choice, btnRef) { return function() { selectOption(choice, btnRef); }; })(q.options[i], optBtn);
      optionsList.appendChild(optBtn);
    }
  }

  function selectOption(choice, btnRef) {
    if (answered) return;
    answered = true;

    var currentQ = questionQueue[currentIndex];
    var wasCorrect = choice === correctAnswer;
    var resultText = document.getElementById("result");

    var allButtons = document.querySelectorAll("#optionsList .option-btn");
    for (var i = 0; i < allButtons.length; i++) {
      allButtons[i].disabled = true;
      if (allButtons[i].innerHTML === correctAnswer) allButtons[i].classList.add("correct");
    }

    if (wasCorrect) {
      resultText.innerHTML = "✅ Correct!";
      resultText.style.color = "green";
    } else {
      btnRef.classList.add("wrong");
      resultText.innerHTML = "❌ Wrong. Correct answer highlighted above.";
      resultText.style.color = "red";
      if (currentQ.isBonus) { masteryFailed = true; }
      else { questionQueue.push(pickBonusQuestion()); }
    }

    document.getElementById("nextBtn").classList.remove("hidden");
  }

  function goToNext() {
    currentIndex++;
    if (currentIndex >= questionQueue.length) { finishSession(); return; }
    showCurrentQuestion();
  }

  function finishSession() {
    var resultText = document.getElementById("result");
    document.getElementById("optionsList").innerHTML = "";
    document.getElementById("progress").innerHTML = "";
    document.getElementById("nextBtn").classList.add("hidden");

    if (masteryFailed) {
      document.getElementById("topic").innerHTML = "";
      document.getElementById("question").innerHTML = "Not mastered this time.";
      resultText.innerHTML = "Try this subject again to earn Mastery.";
      resultText.style.color = "#d97706";
    } else {
      subjectMastery[currentSubject] = true;
      document.getElementById("topic").innerHTML = "";
      document.getElementById("question").innerHTML = "🏆 Subject Mastered!";
      resultText.innerHTML = "You answered every question correctly.";
      resultText.style.color = "green";
    }
  }

  switchTab("favourites");
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDHc9vS_q2DFfr1rnGLyUkAfcp8QkAKyss",
    authDomain: "mathflux-d3b47.firebaseapp.com",
    projectId: "mathflux-d3b47",
    storageBucket: "mathflux-d3b47.firebasestorage.app",
    messagingSenderId: "280421081797",
    appId: "1:280421081797:web:d7b70c925d4ab493e386ac",
    measurementId: "G-J86YF92MZW"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // make these available to the rest of our app's code
  window.firebaseAuth = auth;
  window.firebaseCreateUser = createUserWithEmailAndPassword;
  window.firebaseSignIn = signInWithEmailAndPassword;
  window.firebaseSignOut = signOut;
  window.firebaseOnAuthChange = onAuthStateChanged;
  var isSignUpMode = false;

  window.toggleAuthMode = function() {
    isSignUpMode = !isSignUpMode;
    document.getElementById("authTitle").innerHTML = isSignUpMode ? "Sign Up" : "Log In";
    document.getElementById("authSubmitBtn").innerHTML = isSignUpMode ? "Sign Up" : "Log In";
    document.getElementById("authSwitchText").innerHTML = isSignUpMode
      ? 'Already have an account? <a onclick="toggleAuthMode()">Log In</a>'
      : "Don't have an account? <a onclick=\"toggleAuthMode()\">Sign Up</a>";
    document.getElementById("authError").innerHTML = "";
  };

  window.handleAuthSubmit = function() {
    var email = document.getElementById("authEmail").value;
    var password = document.getElementById("authPassword").value;
    var errorBox = document.getElementById("authError");
    errorBox.innerHTML = "";

    var action = isSignUpMode
      ? window.firebaseCreateUser(window.firebaseAuth, email, password)
      : window.firebaseSignIn(window.firebaseAuth, email, password);

    action.catch(function(error) {
      errorBox.innerHTML = error.message;
    });
  };

  window.handleLogout = function() {
    window.firebaseSignOut(window.firebaseAuth);
  };

  window.firebaseOnAuthChange(window.firebaseAuth, function(user) {
    if (user) {
      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");
    } else {
      document.getElementById("authScreen").classList.remove("hidden");
      document.getElementById("appScreen").classList.add("hidden");
    }
  });
</script>

</body>
</html>
