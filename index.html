<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Merit — Test Prep</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#12182B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   Palette: exam-ledger navy ink, warm paper background, brass
   "mastery" gold, hairline rule, correct/incorrect signal colors.
   Type: Source Serif 4 (display/headings) + Inter (body/UI) +
   IBM Plex Mono (scores, percentages, counters — the "data" face).
   Signature: course cards styled like admit cards / roll-number
   slips with a perforated edge and a corner progress stub, since
   this product's whole world is entrance-test admission.
   ============================================================ */
:root{   
  --ink:#12182B;
  --ink-soft:#4A5169;
  --paper:#F6F3EA;
  --paper-raised:#FFFFFF;
  --rule:#DBD3BF;
  --gold:#AD8A2E;
  --gold-soft:#F1E6C8;
  --correct:#2F7D5C;
  --correct-soft:#00b5b5;
  --incorrect:#ff0011;
  --incorrect-soft:#F7E6DE;
  --shadow: 0 1px 2px rgba(18,24,43,.06), 0 8px 24px -12px rgba(18,24,43,.18);
  --radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:76px;
}
h1,h2,h3,.serif{ font-family:'Source Serif 4', Georgia, serif; }
.mono{ font-family:'IBM Plex Mono', monospace; }
button{ font-family:inherit; cursor:pointer; }
a{color:inherit;}
::selection{ background:var(--gold-soft); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ---------- App shell ---------- */
#app{ max-width:640px; margin:0 auto; min-height:100vh; position:relative; background:var(--paper); }

header.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--paper); border-bottom:1px solid var(--rule);
  padding:18px 18px 14px;
}
.brand{ display:flex; align-items:center; justify-content:space-between; }
.brand-mark{ display:flex; align-items:center; gap:10px; }
.brand-badge{
  width:34px;height:34px;border-radius:9px;
  background:var(--ink); color:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;
  font-family:'Source Serif 4',serif; font-weight:700; font-size:17px;
}
.brand-name{ font-family:'Source Serif 4',serif; font-weight:700; font-size:20px; letter-spacing:.2px; }
.brand-tag{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.12em; margin-top:1px;}
.stat-pill{
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:20px;
  padding:6px 10px; color:var(--ink-soft);
}

.breadcrumbs{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-soft); margin-top:12px;
}
.breadcrumbs button{
  background:none;border:none;color:var(--ink-soft);font-size:12.5px;padding:2px 0;
  border-bottom:1px solid transparent;
}
.breadcrumbs button:hover{ color:var(--ink); border-color:var(--rule); }
.breadcrumbs .sep{ color:var(--rule); }
.breadcrumbs .current{ color:var(--ink); font-weight:600; }

main{ padding:16px 18px 28px; }

/* ---------- Tab bar ---------- */
nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--paper-raised); border-top:1px solid var(--rule);
}
.tabbar-inner{
  max-width:640px; margin:0 auto;
  display:grid; grid-template-columns:repeat(3,1fr);
}
.tab-btn{
  background:none; border:none; padding:10px 4px 12px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--ink-soft); font-size:11.5px; font-weight:600;
  letter-spacing:.02em;
}
.tab-btn svg{ width:21px; height:21px; }
.tab-btn.active{ color:var(--ink); }
.tab-btn.active svg{ stroke:var(--gold); }
.tab-btn .dot{ width:4px;height:4px;border-radius:50%; background:var(--gold); opacity:0; margin-top:-2px; }
.tab-btn.active .dot{ opacity:1; }

/* ---------- Section heading ---------- */
.section-head{ margin:4px 0 14px; }
.section-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); font-weight:700; }
.section-title{ font-size:23px; font-weight:600; margin:3px 0 2px; }
.section-sub{ font-size:13.5px; color:var(--ink-soft); }

/* ---------- Course cards: "admit card" signature ---------- */
.course-grid{ display:flex; flex-direction:column; gap:14px; }
.admit-card{
  position:relative;
  background:var(--paper-raised);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  overflow:hidden;
  text-align:left;
  width:100%;
  padding:0;
}
.admit-main{ flex:1; padding:16px 14px 15px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
.admit-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.admit-course-name{ font-family:'Source Serif 4',serif; font-weight:600; font-size:17px; line-height:1.2; }
.admit-course-full{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.star-btn{ background:none; border:none; padding:4px; flex-shrink:0; color:var(--rule); }
.star-btn.active{ color:var(--gold); }
.star-btn svg{ width:19px; height:19px; }
.admit-meta{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--ink-soft); }
.progress-track{ flex:1; height:6px; border-radius:4px; background:var(--rule); overflow:hidden; }
.progress-fill{ height:100%; background:var(--gold); border-radius:4px; }
.progress-pct{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--ink); min-width:30px; text-align:right; }
.admit-stub{
  width:64px; flex-shrink:0;
  background:var(--ink); color:var(--gold-soft);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border-left:2px dashed var(--rule);
  position:relative;
}
.admit-stub::before, .admit-stub::after{
  content:''; position:absolute; left:-6px; width:12px; height:12px; border-radius:50%;
  background:var(--paper);
}
.admit-stub::before{ top:-6px; }
.admit-stub::after{ bottom:-6px; }
.admit-stub-num{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; }
.admit-stub-label{ font-size:8.5px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; }

/* ---------- Generic list rows (subjects, chapters, topics) ---------- */
.row-list{ display:flex; flex-direction:column; gap:10px; }
.row-card{
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:12px;
  padding:14px 14px; display:flex; align-items:center; gap:12px;
  text-align:left; width:100%; box-shadow:var(--shadow);
}
.row-icon{
  width:38px;height:38px;border-radius:10px; flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft); color:var(--gold); font-weight:700; font-family:'Source Serif 4',serif;
}
.row-body{ flex:1; min-width:0; }
.row-title{ font-weight:600; font-size:14.5px; }
.row-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.row-chev{ color:var(--rule); flex-shrink:0; }
.row-chev svg{ width:18px;height:18px; }
.row-card.mastered .row-icon{ background:var(--correct-soft); color:var(--correct); }
.badge{
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; padding:3px 7px; border-radius:20px;
  border:1px solid var(--rule); color:var(--ink-soft); flex-shrink:0;
}
.badge.mastered{ background:var(--correct-soft); color:var(--correct); border-color:transparent; }
.badge.practicing{ background:var(--gold-soft); color:var(--gold); border-color:transparent; }

/* mastery block at end of topic list */
.mastery-block{
  margin-top:18px; padding:18px; border-radius:var(--radius);
  background:var(--ink); color:var(--paper);
  display:flex; flex-direction:column; gap:10px;
  border:1px solid var(--ink);
}
.mastery-block .m-eyebrow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); font-weight:700; }
.mastery-block h3{ margin:0; font-size:18px; }
.mastery-block p{ margin:0; font-size:12.5px; color:#C9CBD8; line-height:1.5; }
.mastery-block .m-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:4px; }
.btn-primary{
  background:var(--gold); color:var(--ink); border:none; border-radius:10px;
  padding:11px 18px; font-weight:700; font-size:13.5px; white-space:nowrap;
}
.btn-primary:disabled{ opacity:.5; }
.btn-ghost{
  background:transparent; color:inherit; border:1px solid var(--rule); border-radius:10px;
  padding:10px 16px; font-weight:600; font-size:13.5px;
}
.mastery-block .btn-ghost{ border-color:#3A4058; color:var(--paper); }

/* ---------- Empty state ---------- */
.empty{ text-align:center; padding:56px 20px; color:var(--ink-soft); }
.empty svg{ width:38px;height:38px; color:var(--rule); margin-bottom:10px; }
.empty p{ font-size:13.5px; max-width:260px; margin:0 auto; line-height:1.5; }
.empty strong{ color:var(--ink); }

/* ---------- Quiz ---------- */
.quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.quiz-progress-track{ flex:1; height:6px; background:var(--rule); border-radius:4px; margin:0 12px; overflow:hidden; }
.quiz-progress-fill{ height:100%; background:var(--gold); }
.quiz-count{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
.bonus-flag{
  display:inline-flex; align-items:center; gap:5px; background:var(--gold-soft); color:var(--gold);
  font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; margin-bottom:10px;
}
.q-card{
  background:var(--paper-raised); border:1px solid var(--rule); border-radius:var(--radius);
  padding:20px 18px; box-shadow:var(--shadow);
}
.q-text{ font-size:16.5px; font-weight:600; line-height:1.4; margin:0 0 16px; font-family:'Source Serif 4',serif; }
.options{ display:flex; flex-direction:column; gap:9px; }
.option-btn{
  text-align:left; background:var(--paper); border:1.5px solid var(--rule); border-radius:11px;
  padding:12px 14px; font-size:14px; display:flex; align-items:center; gap:11px; line-height:1.4;
  width:100%;
}
.option-letter{
  width:24px;height:24px;border-radius:50%; border:1.5px solid var(--rule); flex-shrink:0;
  display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
}
.option-btn:not(:disabled):hover{ border-color:var(--gold); }
.option-btn.selected{ background:var(--gold-soft); border-color:var(--gold); }
.option-btn.selected .option-letter{ background:var(--gold); border-color:var(--gold); color:#fff; }
.option-btn.correct{ background:var(--correct-soft); border-color:var(--correct); }
.option-btn.correct .option-letter{ background:var(--correct); border-color:var(--correct); color:#fff; }
.option-btn.incorrect{ background:var(--incorrect-soft); border-color:var(--incorrect); }
.option-btn.incorrect .option-letter{ background:var(--incorrect); border-color:var(--incorrect); color:#fff; }
.option-btn:disabled{ opacity:.72; }
.option-btn:disabled.correct, .option-btn:disabled.incorrect{ opacity:1; }

.explain{
  margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.5;
  background:var(--paper); border:1px solid var(--rule); color:var(--ink-soft);
}
.explain strong{ color:var(--ink); }
.q-footer{ margin-top:16px; display:flex; justify-content:flex-end; }

/* ---------- Results ---------- */
.result-card{
  background:var(--ink); color:var(--paper); border-radius:var(--radius); padding:28px 22px;
  text-align:center; box-shadow:var(--shadow);
}
.result-ring{
  width:112px;height:112px;border-radius:50%; margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--pct)*1%), #2A3050 0);
  position:relative;
}
.result-ring::before{ content:''; position:absolute; inset:8px; border-radius:50%; background:var(--ink); }
.result-ring-label{ position:relative; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:22px; }
.result-title{ font-size:19px; font-weight:600; margin:0 0 4px; }
.result-sub{ font-size:13px; color:#C9CBD8; margin:0 0 18px; }
.result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.result-card .btn-ghost{ border-color:#3A4058; color:var(--paper); }

/* misc */
.top-actions{ display:flex; justify-content:flex-end; margin-bottom:4px; }
.icon-btn{ background:none; border:none; color:var(--ink-soft); display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================================================================
   DATA MODEL
   Course -> Subjects -> Chapters -> Topics. Every object has a
   stable `id` used as the progress-tracking key. Each subject has
   a `type` that selects which question-template set is used to
   generate its practice questions.
   ================================================================ */

const CUSTOM_QUESTION_BANKS = {}; // topicId -> array of 15 hand-authored {q, options, correct, explain} (optional override)

const COURSES = [
  {
    id:'mdcat', name:'MDCAT', full:'Medical & Dental College Admission Test (PMDC 2025 Syllabus)', icon:'M',

        { id:'mdcat-bio-c3', name:'Biological Molecules', topics:[{id:'mdcat-bio-c3-t1', name:'Biological Molecules (Definition and Classification)'}, {id:'mdcat-bio-c3-t2', name:'Biological Importance of Water'}, {id:'mdcat-bio-c3-t3', name:'Carbohydrates'}, {id:'mdcat-bio-c3-t4', name:'Proteins'}, {id:'mdcat-bio-c3-t5', name:'Lipids'}, {id:'mdcat-bio-c3-t6', name:'Ribonucleic Acid (RNA)'}, {id:'mdcat-bio-c3-t7', name:'Conjugated Molecules'}, {id:'mdcat-bio-c3-t8', name:'Structure of DNA'}] },
        { id:'mdcat-bio-c4', name:'Cell Structure and Function', topics:[{id:'mdcat-bio-c4-t1', name:'Cell Structure'}, {id:'mdcat-bio-c4-t2', name:'Prokaryotic and Eukaryotic Cells'}, {id:'mdcat-bio-c4-t3', name:'Cytoplasmic Organelles'}, {id:'mdcat-bio-c4-t4', name:'Chromosomes'}] },
        { id:'mdcat-bio-c5', name:'Coordination and Control (Nervous and Chemical Coordination)', topics:[{id:'mdcat-bio-c5-t1', name:'Receptors'}, {id:'mdcat-bio-c5-t2', name:'Neurons'}, {id:'mdcat-bio-c5-t3', name:'Brain'}] },
        { id:'mdcat-bio-c6', name:'Enzymes', topics:[{id:'mdcat-bio-c6-t1', name:'Enzymes'}, {id:'mdcat-bio-c6-t2', name:'Mode of Enzyme Action'}, {id:'mdcat-bio-c6-t3', name:'Factors Affecting Rate of Enzyme Reactions'}, {id:'mdcat-bio-c6-t4', name:'Enzyme Inhibitors'}] },
        { id:'mdcat-bio-c7', name:'Evolution', topics:[{id:'mdcat-bio-c7-t1', name:'Concept of Evolution'}, {id:'mdcat-bio-c7-t2', name:'Lamarckism'}, {id:'mdcat-bio-c7-t3', name:'Darwinism'}] },
        { id:'mdcat-bio-c8', name:'Reproduction', topics:[{id:'mdcat-bio-c8-t1', name:'Human Reproductive System'}, {id:'mdcat-bio-c8-t2', name:'Menstrual Cycle'}, {id:'mdcat-bio-c8-t3', name:'Sexually Transmitted Diseases'}] },
        { id:'mdcat-bio-c9', name:'Support and Movement', topics:[{id:'mdcat-bio-c9-t1', name:'Human Skeleton'}, {id:'mdcat-bio-c9-t2', name:'Muscles'}, {id:'mdcat-bio-c9-t3', name:'Skeletal Muscles'}, {id:'mdcat-bio-c9-t4', name:'Muscle Contraction'}, {id:'mdcat-bio-c9-t5', name:'Joints'}, {id:'mdcat-bio-c9-t6', name:'Arthritis'}] },
        { id:'mdcat-bio-c10', name:'Inheritance', topics:[{id:'mdcat-bio-c10-t1', name:'Mendel\'s Laws of Inheritance'}, {id:'mdcat-bio-c10-t2', name:'Gene Linkage and Crossing Over'}, {id:'mdcat-bio-c10-t3', name:'X-linked Recessive Inheritance'}] },
        { id:'mdcat-bio-c11', name:'Circulation', topics:[{id:'mdcat-bio-c11-t1', name:'Human Heart'}, {id:'mdcat-bio-c11-t2', name:'Cardiac Cycle and Phases of Heartbeat'}, {id:'mdcat-bio-c11-t3', name:'Blood Vessels'}, {id:'mdcat-bio-c11-t4', name:'Lymphatic System'}] },
        { id:'mdcat-bio-c12', name:'Immunity', topics:[{id:'mdcat-bio-c12-t1', name:'Specific Defense Mechanism'}] },
        { id:'mdcat-bio-c13', name:'Respiration (Human Respiratory System)', topics:[{id:'mdcat-bio-c13-t1', name:'Human Respiratory System'}] },
        { id:'mdcat-bio-c14', name:'Digestion', topics:[{id:'mdcat-bio-c14-t1', name:'Human Digestive System'}] },
        { id:'mdcat-bio-c15', name:'Homeostasis', topics:[{id:'mdcat-bio-c15-t1', name:'Homeostasis (Kidney)'}, {id:'mdcat-bio-c15-t2', name:'Thermoregulation'}, {id:'mdcat-bio-c15-t3', name:'Excretion'}] },
        { id:'mdcat-bio-c16', name:'Biotechnology', topics:[{id:'mdcat-bio-c16-t1', name:'Biotechnology and Health Care'}] }
      ]},
      { id:'mdcat-chem', name:'Chemistry', type:'chemistry', chapters:[
        { id:'mdcat-chem-c1', name:'Introduction to Fundamental Concepts of Chemistry', topics:[{id:'mdcat-chem-c1-t1', name:'Moles and Avogadro\'s Number'}, {id:'mdcat-chem-c1-t2', name:'Limiting and Excess Reactants'}, {id:'mdcat-chem-c1-t3', name:'Yield'}] },
        { id:'mdcat-chem-c2', name:'Atomic Structure', topics:[{id:'mdcat-chem-c2-t1', name:'Discovery of Proton and Planck\'s Quantum Theory'}, {id:'mdcat-chem-c2-t2', name:'Quantum Numbers'}, {id:'mdcat-chem-c2-t3', name:'Shapes of Orbitals'}, {id:'mdcat-chem-c2-t4', name:'Spectrum of Hydrogen'}, {id:'mdcat-chem-c2-t5', name:'Electronic Configuration'}] },
        { id:'mdcat-chem-c3', name:'Gases', topics:[{id:'mdcat-chem-c3-t1', name:'Kinetic Molecular Theory'}, {id:'mdcat-chem-c3-t2', name:'Standard Temperature and Pressure (STP)'}, {id:'mdcat-chem-c3-t3', name:'Boyle\'s Law'}, {id:'mdcat-chem-c3-t4', name:'Charles\'s Law'}, {id:'mdcat-chem-c3-t5', name:'Absolute Zero'}, {id:'mdcat-chem-c3-t6', name:'Ideal Gas Equation'}, {id:'mdcat-chem-c3-t7', name:'Unit of Gas Constant "R"'}, {id:'mdcat-chem-c3-t8', name:'Real and Ideal Gases'}] },

        { id:'mdcat-chem-c5', name:'Solids', topics:[{id:'mdcat-chem-c5-t1', name:'Crystalline Solids'}, {id:'mdcat-chem-c5-t2', name:'Factors Affecting the Shape of Ionic Crystals'}, {id:'mdcat-chem-c5-t3', name:'Ionic vs Molecular Crystals'}, {id:'mdcat-chem-c5-t4', name:'Crystal Lattice'}, {id:'mdcat-chem-c5-t5', name:'Lattice Energy'}] },

        { id:'mdcat-chem-c7', name:'Reaction Kinetics', topics:[{id:'mdcat-chem-c7-t1', name:'Chemical Kinetics'}, {id:'mdcat-chem-c7-t2', name:'Factors Affecting Rate of Reaction'}, {id:'mdcat-chem-c7-t3', name:'Order of Reaction'}, {id:'mdcat-chem-c7-t4', name:'Rate Constant'}] },

/* ================================================================
   QUESTION GENERATION
   Every topic gets a deterministic bank of 15 MCQs, seeded on the
   topic id so the same topic always produces the same questions —
   progress stays stable across sessions. This is placeholder
   practice content, not vetted exam material — replace any topic's
   bank with real questions via CUSTOM_QUESTION_BANKS[topicId].
   ================================================================ */

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mcq(rng, q, correctText, distractorPool, explain){
  const pool = distractorPool.slice();
  const chosen = [];
  while(chosen.length < 3 && pool.length){
    const i = Math.floor(rng() * pool.length);
    chosen.push(pool.splice(i,1)[0]);
  }
  const options = [correctText, ...chosen];
  for(let i=options.length-1;i>0;i--){
    const j = Math.floor(rng() * (i+1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return { q, options, correct: options.indexOf(correctText), explain };
}

function generateQuestionBank(topic, type){
  if(CUSTOM_QUESTION_BANKS[topic.id]) return CUSTOM_QUESTION_BANKS[topic.id];
  const rng = mulberry32(hashStr(topic.id));
  const templates = TEMPLATES[type] || TEMPLATES.logical;
  const bank = [];
  for(let i=0;i<15;i++){
    bank.push(templates[i % templates.length](topic.name, rng));
  }
  return bank;
}

/* ================================================================
   PROGRESS STORAGE
   ================================================================ */
const STORAGE_KEY = 'merit_progress_v1';
const STAR_KEY = 'merit_starred_v1';
const MASTERY_THRESHOLD = 80; // percent

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
function loadStarred(){
  try{ return new Set(JSON.parse(localStorage.getItem(STAR_KEY)) || []); }
  catch(e){ return new Set(); }
}
function saveStarred(){ localStorage.setItem(STAR_KEY, JSON.stringify([...starred])); }

let progress = loadProgress(); // topicId -> { bestScore, attempts, mastered }
let starred = loadStarred();   // Set of courseId

/* ================================================================
   LOOKUPS
   ================================================================ */
function findCourse(id){ return COURSES.find(c=>c.id===id); }
function findSubject(course,id){ return course.subjects.find(s=>s.id===id); }
function findChapter(subject,id){ return subject.chapters.find(c=>c.id===id); }
function findTopic(chapter,id){ return chapter.topics.find(t=>t.id===id); }

function allTopicsOfCourse(course){
  const out = [];
  course.subjects.forEach(s=>s.chapters.forEach(c=>c.topics.forEach(t=>out.push(t))));
  return out;
}
function allTopicsOfSubject(subject){
  const out = [];
  subject.chapters.forEach(c=>c.topics.forEach(t=>out.push(t)));
  return out;
}
function courseProgressPct(course){
  const topics = allTopicsOfCourse(course);
  if(!topics.length) return 0;
  const mastered = topics.filter(t=>progress[t.id]?.mastered).length;
  return Math.round((mastered/topics.length)*100);
}
function subjectProgressPct(subject){
  const topics = allTopicsOfSubject(subject);
  if(!topics.length) return 0;
  const mastered = topics.filter(t=>progress[t.id]?.mastered).length;
  return Math.round((mastered/topics.length)*100);
}
function chapterProgressPct(chapter){
  if(!chapter.topics.length) return 0;
  const mastered = chapter.topics.filter(t=>progress[t.id]?.mastered).length;
  return Math.round((mastered/chapter.topics.length)*100);
}

/* ================================================================
   APP STATE + ROUTING
   ================================================================ */
const state = {
  tab: 'courses',       // courses | progress | saved
  view: 'courses',      // courses | subjects | chapters | topics | quiz | results
  courseId: null,
  subjectId: null,
  chapterId: null,
  topicId: null,
  quiz: null,            // { bank, index, correctCount, selected, answered, locked }
};

function go(view, patch){
  Object.assign(state, patch||{});
  state.view = view;
  render();
  window.scrollTo({top:0, behavior:'instant' in window.scrollTo ? 'instant' : 'auto'});
}
function goTab(tab){
  state.tab = tab;
  state.view = tab === 'progress' ? 'progressView' : tab === 'saved' ? 'savedView' : 'courses';
  state.courseId = null; state.subjectId = null; state.chapterId = null; state.topicId = null; state.quiz = null;
  render();
}

function startQuiz(topicId, courseId, subjectId, chapterId){
  const course = findCourse(courseId);
  const subject = findSubject(course, subjectId);
  const chapter = findChapter(subject, chapterId);
  const topic = findTopic(chapter, topicId);
  const bank = generateQuestionBank(topic, subject.type);
  state.quiz = { bank, index:0, correctCount:0, selected:null, answered:null, locked:false };
  go('quiz', { courseId, subjectId, chapterId, topicId });
}

/* Step 1: tapping an option just selects it — no grading yet, so the
   person can change their mind before committing. */
function selectAnswer(optionIndex){
  const q = state.quiz;
  if(q.locked) return;
  q.selected = optionIndex;
  render();
}
/* Step 2: "Check Answer" locks in the current selection, grades it,
   and reveals correct/incorrect + explanation. */
function checkAnswer(){
  const q = state.quiz;
  if(q.locked || q.selected===null) return;
  q.locked = true;
  q.answered = q.selected;
  const question = q.bank[q.index];
  if(q.answered === question.correct) q.correctCount++;
  render();
}
function nextQuiz(){
  const q = state.quiz;
  if(q.index < q.bank.length-1){
    q.index++; q.selected = null; q.answered = null; q.locked = false;
    render();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  const q = state.quiz;
  const pct = Math.round((q.correctCount / q.bank.length) * 100);
  const existing = progress[state.topicId] || { bestScore:0, attempts:0, mastered:false };
  existing.attempts += 1;
  existing.bestScore = Math.max(existing.bestScore, pct);
  existing.mastered = existing.bestScore >= MASTERY_THRESHOLD;
  progress[state.topicId] = existing;
  saveProgress();
  state.lastScore = pct;
  go('results');
}
function retryQuiz(){
  startQuiz(state.topicId, state.courseId, state.subjectId, state.chapterId);
}
function toggleStar(courseId){
  if(starred.has(courseId)) starred.delete(courseId); else starred.add(courseId);
  saveStarred();
  render();
}

/* ================================================================

   ================================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderBreadcrumbs(){
  const crumbs = [{label:'Courses', action:"data-nav='courses'"}];
  const course = state.courseId ? findCourse(state.courseId) : null;
  const subject = course && state.subjectId ? findSubject(course, state.subjectId) : null;
  const chapter = subject && state.chapterId ? findChapter(subject, state.chapterId) : null;

  if(course) crumbs.push({label:course.name, action:`data-nav="subjects" data-course="${course.id}"`});
  if(subject) crumbs.push({label:subject.name, action:`data-nav="chapters" data-course="${course.id}" data-subject="${subject.id}"`});
  if(chapter) crumbs.push({label:chapter.name, action:`data-nav="topics" data-course="${course.id}" data-subject="${subject.id}" data-chapter="${chapter.id}"`});

  if(crumbs.length<=1 && !['quiz','results'].includes(state.view)) return '';

  return `<div class="breadcrumbs">${crumbs.map((c,i)=>{
    const isLast = i===crumbs.length-1 && !['quiz','results'].includes(state.view);
    if(isLast) return `<span class="current">${esc(c.label)}</span>`;
    return `<button ${c.action}>${esc(c.label)}</button><span class="sep">/</span>`;
  }).join('')}</div>`;
}

function renderTopbar(){
  const totalMastered = Object.values(progress).filter(p=>p.mastered).length;
  return `
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-badge">M</div>
        <div>
          <div class="brand-name">Merit</div>
          <div class="brand-tag">Test Prep</div>
        </div>
      </div>
      <div class="stat-pill mono">${totalMastered} mastered</div>
    </div>
    ${renderBreadcrumbs()}
  </header>`;
}

}

            <div class="progress-pct mono">${pct}%</div>
          </div>
        </button>
        <div class="admit-stub">
          <div class="admit-stub-num">${c.subjects.length}</div>
          <div class="admit-stub-label">Subjects</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderSubjectsView(){
  const course = findCourse(state.courseId);
  return `
  <div class="section-head">
    <div class="section-eyebrow">${esc(course.full)}</div>
    <div class="section-title">${esc(course.name)} Subjects</div>
    <div class="section-sub">${course.subjects.length} subjects to master.</div>
  </div>
  <div class="row-list">
    ${course.subjects.map(s=>{
      const pct = subjectProgressPct(s);
      const mastered = pct===100;
      return `
      <button class="row-card ${mastered?'mastered':''}" data-nav="chapters" data-course="${course.id}" data-subject="${s.id}">
        <div class="row-icon">${esc(s.name[0])}</div>
        <div class="row-body">
          <div class="row-title">${esc(s.name)}</div>
          <div class="row-sub">${s.chapters.length} chapters · ${pct}% mastered</div>
        </div>
        <span class="row-chev">${ICONS.chevron}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function renderChaptersView(){
  const course = findCourse(state.courseId);
  const subject = findSubject(course, state.subjectId);
  return `
  <div class="section-head">
    <div class="section-eyebrow">${esc(course.name)} · ${esc(subject.name)}</div>
    <div class="section-title">Chapters</div>
    <div class="section-sub">${subject.chapters.length} chapters in this subject.</div>
  </div>
  <div class="row-list">
    ${subject.chapters.map(ch=>{
      const pct = chapterProgressPct(ch);
      const mastered = pct===100;
      return `
      <button class="row-card ${mastered?'mastered':''}" data-nav="topics" data-course="${course.id}" data-subject="${subject.id}" data-chapter="${ch.id}">
        <div class="row-icon">${mastered ? '✓' : esc(String(ch.topics.length))}</div>
        <div class="row-body">
          <div class="row-title">${esc(ch.name)}</div>
          <div class="row-sub">${ch.topics.length} topics · ${pct}% mastered</div>
        </div>
        <span class="row-chev">${ICONS.chevron}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function renderTopicsView(){
  const course = findCourse(state.courseId);
  const subject = findSubject(course, state.subjectId);
  const chapter = findChapter(subject, state.chapterId);
  const pct = chapterProgressPct(chapter);
  const firstUnmastered = chapter.topics.find(t=>!progress[t.id]?.mastered) || chapter.topics[0];

  return `
  <div class="section-head">
    <div class="section-eyebrow">${esc(subject.name)}</div>
    <div class="section-title">${esc(chapter.name)}</div>
    <div class="section-sub">${chapter.topics.length} topics · 15 questions each.</div>
  </div>
  <div class="row-list">
    ${chapter.topics.map(t=>{
      const p = progress[t.id];
      const mastered = p?.mastered;
      const started = p && p.attempts > 0;
      return `
      <button class="row-card ${mastered?'mastered':''}" data-quiz="${t.id}" data-course="${course.id}" data-subject="${subject.id}" data-chapter="${chapter.id}">
        <div class="row-icon">${mastered ? '✓' : ICONS.book}</div>
        <div class="row-body">
          <div class="row-title">${esc(t.name)}</div>
          <div class="row-sub">${started ? `Best score: ${p.bestScore}%` : 'Not started yet'}</div>
        </div>
        ${mastered ? '<span class="badge mastered">Mastered</span>' : started ? '<span class="badge practicing">Practicing</span>' : ''}
      </button>`;
    }).join('')}
  </div>
  <div class="mastery-block">
    <div class="m-eyebrow">Chapter Mastery</div>
    <h3>${pct}% complete</h3>
    <p>Master every topic in this chapter by scoring ${MASTERY_THRESHOLD}% or higher on its quiz.</p>
    <div class="m-row">
      <button class="btn-ghost" data-nav="chapters" data-course="${course.id}" data-subject="${subject.id}">Back to chapters</button>
      <button class="btn-primary" data-quiz="${firstUnmastered.id}" data-course="${course.id}" data-subject="${subject.id}" data-chapter="${chapter.id}">${pct===100 ? 'Review Again' : 'Continue Practice'}</button>
    </div>
  </div>`;
}

function renderQuizView(){
  const q = state.quiz;
  const question = q.bank[q.index];
  const pctThroughQuiz = Math.round(((q.index) / q.bank.length) * 100);
  const isBonus = (q.index+1) % 5 === 0;

  return `
  <div class="quiz-head">
    <button class="icon-btn" data-nav="topics" data-course="${state.courseId}" data-subject="${state.subjectId}" data-chapter="${state.chapterId}">${ICONS.back} Exit</button>
    <div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:${pctThroughQuiz}%"></div></div>
    <div class="quiz-count mono">${q.index+1}/${q.bank.length}</div>
  </div>
  ${isBonus ? `<div class="bonus-flag">★ Milestone question</div>` : ''}
  <div class="q-card">
    <div class="q-text">${esc(question.q)}</div>
    <div class="options">
      ${question.options.map((opt,i)=>{
        let cls = '';
        if(q.locked){
          if(i===question.correct) cls = 'correct';
          else if(i===q.answered) cls = 'incorrect';
        } else if(i===q.selected){
          cls = 'selected';
        }
        return `
        <button class="option-btn ${cls}" data-select="${i}" ${q.locked?'disabled':''}>
          <span class="option-letter">${String.fromCharCode(65+i)}</span>
          <span>${esc(opt)}</span>
        </button>`;
      }).join('')}
    </div>
    ${q.locked ? `<div class="explain"><strong>${q.answered===question.correct?'Correct.':'Not quite.'}</strong> ${esc(question.explain)}</div>` : ''}
    <div class="q-footer">
      ${!q.locked ? `<button class="btn-primary" data-check="1" ${q.selected===null?'disabled':''}>Check Answer</button>` : ''}
      ${q.locked ? `<button class="btn-primary" data-next="1">${q.index<q.bank.length-1?'Next Question':'See Results'}</button>` : ''}
    </div>
  </div>`;
}

function renderResultsView(){
  const pct = state.lastScore;
  const course = findCourse(state.courseId);
  const subject = findSubject(course, state.subjectId);
  const chapter = findChapter(subject, state.chapterId);
  const topic = findTopic(chapter, state.topicId);
  const mastered = pct >= MASTERY_THRESHOLD;

  return `
  <div class="result-card" style="--pct:${pct}">
    <div class="result-ring"><span class="result-ring-label mono">${pct}%</span></div>
    <div class="result-title">${mastered ? 'Topic Mastered' : 'Keep Practicing'}</div>
    <div class="result-sub">${esc(topic.name)} · ${mastered ? `You've cleared the ${MASTERY_THRESHOLD}% mastery bar.` : `Score ${MASTERY_THRESHOLD}% or higher to master this topic.`}</div>
    <div class="result-actions">
      <button class="btn-ghost" data-nav="topics" data-course="${course.id}" data-subject="${subject.id}" data-chapter="${chapter.id}">Back to Topics</button>
      <button class="btn-primary" data-retry="1">Retry Quiz</button>
    </div>
  </div>`;
}

function renderProgressView(){
  const allTopics = COURSES.flatMap(c=>allTopicsOfCourse(c));
  const masteredCount = allTopics.filter(t=>progress[t.id]?.mastered).length;
  const startedCount = allTopics.filter(t=>progress[t.id]?.attempts>0).length;
  const overallPct = allTopics.length ? Math.round((masteredCount/allTopics.length)*100) : 0;

  return `
  <div class="section-head">
    <div class="section-eyebrow">Overview</div>
    <div class="section-title">Your Progress</div>
    <div class="section-sub">Across all courses.</div>
  </div>
  <div class="mastery-block">
    <div class="m-eyebrow">Overall Mastery</div>
    <h3>${overallPct}%</h3>
    <p>${masteredCount} of ${allTopics.length} topics mastered · ${startedCount} topics started.</p>
  </div>
  <div class="row-list" style="margin-top:16px;">
    ${COURSES.map(c=>{
      const pct = courseProgressPct(c);
      return `
      <button class="row-card" data-nav="subjects" data-course="${c.id}">
        <div class="row-icon">${esc(c.icon)}</div>
        <div class="row-body">
          <div class="row-title">${esc(c.name)}</div>
          <div class="row-sub">${pct}% mastered</div>
        </div>
        <span class="row-chev">${ICONS.chevron}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function renderSavedView(){
  const list = COURSES.filter(c=>starred.has(c.id));
  if(!list.length){
    return `
    <div class="section-head">
      <div class="section-eyebrow">Saved</div>
      <div class="section-title">Saved Courses</div>
    </div>
    <div class="empty">
      ${ICONS.empty}
      <p><strong>No saved courses yet.</strong><br>Tap the star on any course to pin it here.</p>
    </div>`;
  }
  return `
  <div class="section-head">
    <div class="section-eyebrow">Saved</div>
    <div class="section-title">Saved Courses</div>
  </div>
  <div class="course-grid">
    ${list.map(c=>{
      const pct = courseProgressPct(c);
      return `
      <div class="admit-card">
        <button class="admit-main" data-nav="subjects" data-course="${c.id}" style="background:none;border:none;">
          <div class="admit-top">
            <div>
              <div class="admit-course-name">${esc(c.name)}</div>
              <div class="admit-course-full">${esc(c.full)}</div>
            </div>
            <span class="star-btn active" data-star="${c.id}">${ICONS.starFilled}</span>
          </div>
          <div class="admit-meta">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-pct mono">${pct}%</div>
          </div>
        </button>
        <div class="admit-stub">
          <div class="admit-stub-num">${c.subjects.length}</div>
          <div class="admit-stub-label">Subjects</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderMain(){
  switch(state.view){
    case 'courses': return renderCoursesView();
    case 'subjects': return renderSubjectsView();
    case 'chapters': return renderChaptersView();
    case 'topics': return renderTopicsView();
    case 'quiz': return renderQuizView();
    case 'results': return renderResultsView();
    case 'progressView': return renderProgressView();
    case 'savedView': return renderSavedView();
    default: return renderCoursesView();
  }
}

function render(){
  const showTabbar = !['quiz','results'].includes(state.view);
  document.getElementById('app').innerHTML = `
    ${renderTopbar()}
    <main>${renderMain()}</main>
    ${showTabbar ? renderTabbar() : ''}
  `;
}

/* ================================================================
   EVENT DELEGATION
   ================================================================ */
document.getElementById('app').addEventListener('click', (e)=>{
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ goTab(tabBtn.dataset.tab); return; }

  const starBtn = e.target.closest('[data-star]');
  if(starBtn){ e.stopPropagation(); toggleStar(starBtn.dataset.star); return; }

  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    const view = navBtn.dataset.nav;
    go(view, {
      courseId: navBtn.dataset.course || null,
      subjectId: navBtn.dataset.subject || null,
      chapterId: navBtn.dataset.chapter || null,
    });
    return;
  }

  const quizBtn = e.target.closest('[data-quiz]');
  if(quizBtn){
    startQuiz(quizBtn.dataset.quiz, quizBtn.dataset.course, quizBtn.dataset.subject, quizBtn.dataset.chapter);
    return;
  }

  const selectBtn = e.target.closest('[data-select]');
  if(selectBtn){ selectAnswer(Number(selectBtn.dataset.select)); return; }

  const checkBtn = e.target.closest('[data-check]');
  if(checkBtn){ checkAnswer(); return; }

  const nextBtn = e.target.closest('[data-next]');
  if(nextBtn){ nextQuiz(); return; }

  const retryBtn = e.target.closest('[data-retry]');
  if(retryBtn){ retryQuiz(); return; }
});

/* ================================================================
   INIT
   ================================================================ */
render();

/* ---- PWA: register service worker for offline support ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline support unavailable — app still works online */ });
  });
}
</script>
</body>
</html>
