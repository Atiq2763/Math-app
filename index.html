  // ---- Chapter 3 · Biological Molecules · Biological Importance of Water ----
  // 50 hand-authored, syllabus-accurate MCQs covering water's polarity,
  // hydrogen bonding, thermal properties, cohesion/adhesion, solvent
  // properties, and its biological roles (from the PMDC MDCAT question set).
  'mdcat-bio-c3-t2': [
    { q:`Which type of bond joins the oxygen atom to hydrogen atoms within a single water molecule?`, options:[`Non-polar covalent bond`,`Polar covalent bond`,`Hydrogen bond`,`Ionic bond`], correct:1, explain:`Oxygen and hydrogen share electrons unequally within a water molecule, forming a polar covalent bond.` },
    { q:`The attraction between adjacent, separate water molecules is called:`, options:[`Covalent bond`,`Ionic bond`,`Hydrogen bond`,`Peptide bond`], correct:2, explain:`Hydrogen bonds form between the partially positive hydrogen of one water molecule and the partially negative oxygen of a neighboring molecule.` },
    { q:`Water is termed a universal solvent mainly because of its:`, options:[`High heat capacity`,`Polarity and hydrogen bonding ability`,`High density at 4°C`,`Low viscosity`], correct:1, explain:`Water's polarity and ability to form hydrogen bonds let it surround and dissolve a huge range of polar and ionic substances.` },
    { q:`The amount of heat required to raise the temperature of 1g of water by 1°C is defined as its:`, options:[`Specific heat capacity`,`Heat of vaporization`,`Latent heat of fusion`,`Thermal conductivity`], correct:0, explain:`Specific heat capacity is defined as the energy needed to raise 1g of a substance by 1°C.` },
    { q:`The high specific heat capacity of water helps living organisms by:`, options:[`Allowing rapid freezing`,`Acting as a temperature buffer against sudden thermal changes`,`Enhancing evaporation rate`,`Promoting non-polar reactions`], correct:1, explain:`Because water resists rapid temperature change, it buffers organisms and their environments against sudden thermal swings.` },
    { q:`The amount of heat energy absorbed by water when it changes from liquid to gas is termed:`, options:[`Heat of fusion`,`Heat of vaporization`,`Specific heat`,`Ionization constant`], correct:1, explain:`Heat of vaporization is the energy required for water to transition from liquid to gas.` },
    { q:`Evaporative cooling in animals (sweating) and plants (transpiration) is due to water's high:`, options:[`Specific heat capacity`,`Heat of vaporization`,`Surface tension`,`Density at 4°C`], correct:1, explain:`Water's high heat of vaporization means evaporating even a small amount removes a large amount of heat, cooling the surface it leaves.` },
    { q:`Attraction between water molecules and other polar surfaces (such as xylem cell walls) is known as:`, options:[`Cohesion`,`Adhesion`,`Imbibition`,`Viscosity`], correct:1, explain:`Adhesion describes water's attraction to other polar surfaces, distinct from cohesion (attraction between water molecules themselves).` },
    { q:`Attraction between like water molecules due to hydrogen bonding is called:`, options:[`Adhesion`,`Cohesion`,`Capillarity`,`Solvation`], correct:1, explain:`Cohesion is the mutual attraction between water molecules, driven by hydrogen bonding.` },
    { q:`The combined action of cohesion and adhesion in narrow tubes leading to upward water movement is called:`, options:[`Transpiration pull`,`Capillarity`,`Imbibition`,`Plasmolysis`], correct:1, explain:`Capillarity is the rise of water in narrow tubes, driven by the combined effects of cohesion and adhesion.` },
    { q:`Hydrolysis is a chemical reaction in which water is used to:`, options:[`Synthesize macromolecules`,`Break down chemical bonds in polymers`,`Form peptide bonds`,`Produce ATP directly`], correct:1, explain:`Hydrolysis uses a water molecule to break a chemical bond, splitting a polymer into smaller units.` },
    { q:`Which reaction is the exact opposite of hydrolysis, producing water as a byproduct?`, options:[`Photolysis`,`Condensation (Dehydration synthesis)`,`Oxidation`,`Decarboxylation`], correct:1, explain:`Condensation (dehydration synthesis) joins monomers together while releasing a water molecule — the reverse of hydrolysis.` },
    { q:`Hydrophobic substances are characteristically:`, options:[`Polar and soluble in water`,`Non-polar and insoluble in water`,`Ionic and easily dissolved`,`Charged macromolecules`], correct:1, explain:`Hydrophobic substances are non-polar and do not dissolve readily in water.` },
    { q:`Which feature of water causes hydrophobic molecules to aggregate together in aqueous solutions?`, options:[`Hydrophobic exclusion`,`Capillarity`,`High heat of vaporization`,`Ionization`], correct:0, explain:`Hydrophobic exclusion drives non-polar molecules to cluster together in water, minimizing their disruption of water's hydrogen-bond network.` },
    { q:`What percentage of total cell weight in most organisms is accounted for by water?`, options:[`20–30%`,`40–50%`,`70–90%`,`95–99%`], correct:2, explain:`Water typically accounts for about 70–90% of total cell weight in most living organisms.` },
    { q:`Water reaches its maximum density at what temperature?`, options:[`0°C`,`4°C`,`37°C`,`100°C`], correct:1, explain:`Water is most dense at 4°C, becoming less dense both as it warms and as it cools toward freezing.` },
    { q:`Why does ice float on top of liquid water?`, options:[`Ice is denser than liquid water`,`Hydrogen bonds in ice form a open crystalline lattice making it less dense`,`Ice loses oxygen atoms`,`Liquid water has lower surface tension`], correct:1, explain:`In ice, hydrogen bonds lock water molecules into an open crystalline lattice that takes up more space than liquid water, making ice less dense and able to float.` },
    { q:`The floating ice layer on frozen lakes provides an advantage to aquatic life by:`, options:[`Increasing oxygen levels`,`Insulating underlying liquid water from freezing`,`Raising water temperature to 37°C`,`Decreasing solute concentration`], correct:1, explain:`Floating ice insulates the liquid water beneath it, preventing the whole lake from freezing solid and letting aquatic life survive underneath.` },
    { q:`Pure water ionizes into equal concentrations of hydrogen ions (H+) and hydroxyl ions (OH-) at what concentration at 25°C?`, options:[`10^-14 M`,`10^-7 M`,`10^-1 M`,`1.0 M`], correct:1, explain:`Pure water at 25°C ionizes to give equal H+ and OH- concentrations of 10^-7 M each, giving a neutral pH of 7.` },
    { q:`The high surface tension of water is primarily a result of:`, options:[`Covalent bonds between water molecules`,`Cohesive hydrogen bonding at the surface-air interface`,`Adhesion to container walls`,`High specific heat`], correct:1, explain:`Surface water molecules are pulled inward by cohesive hydrogen bonding, creating a taut surface layer responsible for high surface tension.` },
    { q:`Which biological process relies directly on the high surface tension of water?`, options:[`Photosynthesis in mesophyll cells`,`Small insects walking on the surface of pond water`,`ATP synthesis in mitochondria`,`DNA replication`], correct:1, explain:`Water's high surface tension creates a supportive "skin" that lets small insects like water striders walk across pond surfaces.` },
    { q:`Which component of plant cells undergoes swelling due to water pressure, maintaining cell turgidity?`, options:[`Mitochondrion`,`Central vacuole`,`Nucleolus`,`Golgi body`], correct:1, explain:`The large central vacuole fills with water and swells against the cell wall, generating the turgor pressure that keeps plant cells rigid.` },
    { q:`Turgor pressure generated by water inside plant cells provides structural support for:`, options:[`Non-woody (herbaceous) plant stems`,`Trunks of giant oak trees`,`Cellulose synthesis`,`Lignin deposition`], correct:0, explain:`Turgor pressure is especially vital for supporting non-woody, herbaceous plant stems that lack rigid lignified tissue.` },
    { q:`In photosynthesis, water molecules are split during light reactions in a process known as:`, options:[`Hydrolysis`,`Photolysis`,`Glycolysis`,`Plasmolysis`], correct:1, explain:`Photolysis is the light-driven splitting of water molecules during the light-dependent reactions of photosynthesis.` },
    { q:`Photolysis of water during light-dependent reactions of photosynthesis yields oxygen, electrons, and:`, options:[`Carbon dioxide`,`Protons (H+ ions)`,`Glucose`,`Pyruvate`], correct:1, explain:`Splitting water yields oxygen gas, electrons (to replace those lost by chlorophyll), and protons (H+ ions).` },
    { q:`Substances that dissolve readily in water are described as:`, options:[`Hydrophobic`,`Hydrophilic`,`Amphipathic`,`Apolar`], correct:1, explain:`Hydrophilic substances are polar or charged and dissolve readily in water.` },
    { q:`Water acts as an effective lubricant in animal bodies in which location?`, options:[`Synovial joints and pleural cavity`,`Bone matrix`,`Keratinized skin layers`,`Tooth enamel`], correct:0, explain:`Water-based fluids lubricate synovial joints and the pleural cavity, reducing friction between moving surfaces.` },
    { q:`The dielectric constant of water is high, meaning water can effectively:`, options:[`Repel charged ions`,`Reduce electrostatic attraction between oppositely charged ions`,`Prevent hydrogen bonding`,`Promote non-polar aggregation`], correct:1, explain:`Water's high dielectric constant weakens the electrostatic attraction between oppositely charged ions, helping to dissolve ionic compounds.` },
    { q:`When an ionic compound like NaCl dissolves in water, water molecules form surrounding layers called:`, options:[`Cohesion shells`,`Hydration shells (Spheres of hydration)`,`Peptide cages`,`Micelles`], correct:1, explain:`Water molecules orient around dissolved ions to form hydration shells, or spheres of hydration.` },
    { q:`Water acts as a medium for metabolic reactions because it:`, options:[`Inactivates enzymes`,`Dissolves reactants and allows free movement for molecular collisions`,`Freezes easily at physiological temperatures`,`Denatures cellular proteins`], correct:1, explain:`As a solvent, water dissolves metabolic reactants and lets them move freely and collide, enabling biochemical reactions to occur.` },
    { q:`What is the bond angle H-O-H in a bent water molecule?`, options:[`104.5°`,`109.5°`,`120°`,`180°`], correct:0, explain:`The H-O-H bond angle in water is approximately 104.5°, giving the molecule its characteristic bent shape.` },
    { q:`Electronegativity difference between Oxygen and Hydrogen atoms makes water a:`, options:[`Non-polar molecule`,`Polar dipole molecule`,`Charged cation`,`Hydrophobic lipid`], correct:1, explain:`Oxygen's greater electronegativity pulls shared electrons toward itself, making water a polar dipole molecule.` },
    { q:`In a single water molecule, oxygen carries a partial ______ charge while hydrogen carries a partial ______ charge.`, options:[`Positive; Negative`,`Negative; Positive`,`Neutral; Positive`,`Positive; Neutral`], correct:1, explain:`Oxygen pulls shared electrons closer, giving it a partial negative charge, while the hydrogen atoms carry a partial positive charge.` },
    { q:`Which physiological function relies on water's property as an internal transport medium?`, options:[`Blood circulation in animals and sap movement in plants`,`Protein folding in ribosomes`,`Lipid storage in adipose tissue`,`Melanin synthesis in skin`], correct:0, explain:`Water serves as the transport medium for blood in animals and sap in plants, carrying dissolved nutrients and gases throughout the organism.` },
    { q:`How many hydrogen bonds can a single water molecule maximally form with neighboring water molecules in ice?`, options:[`2`,`3`,`4`,`5`], correct:2, explain:`In ice, each water molecule forms up to 4 hydrogen bonds with neighboring molecules, creating the open crystalline lattice.` },
    { q:`Water's ability to absorb or release large amounts of thermal energy with minimal change in its own temperature is due to:`, options:[`Breaking and reforming of numerous hydrogen bonds`,`High viscosity`,`Ionization into H+ and OH-`,`Covalent bond dissociation`], correct:0, explain:`Much of the heat added to or removed from water goes into breaking or reforming hydrogen bonds rather than raising or lowering molecular motion, buffering temperature change.` },
    { q:`Which organelle relies on an aqueous environment to maintain its enzyme activities for cellular respiration?`, options:[`Mitochondrial matrix`,`Cell wall`,`Plasma membrane lipid bilayer`,`Waxy cuticle`], correct:0, explain:`The mitochondrial matrix is an aqueous compartment where Krebs cycle enzymes require water as their working medium.` },
    { q:`Transpiration pull in tall plants is primarily driven by water's:`, options:[`High specific heat`,`Cohesive and adhesive properties`,`Ionization constant`,`Density anomaly`], correct:1, explain:`Cohesion between water molecules and adhesion to xylem walls create a continuous water column that transpiration pull can draw upward.` },
    { q:`Which of the following molecules is hydrophobic?`, options:[`Glucose`,`Sodium chloride`,`Triglyceride (Fat)`,`Amino acid (Glycine)`], correct:2, explain:`Triglycerides are non-polar fats that repel water, making them hydrophobic, unlike the polar/ionic glucose, salt, and amino acids.` },
    { q:`Which term describes molecules that have both hydrophilic (polar) and hydrophobic (non-polar) regions?`, options:[`Amphipathic`,`Isomeric`,`Anphoteric`,`Saturated`], correct:0, explain:`Amphipathic molecules, like phospholipids, have both a polar hydrophilic region and a non-polar hydrophobic region.` },
    { q:`Phospholipids form bilayers in plasma membranes because their fatty acid tails are:`, options:[`Hydrophilic`,`Hydrophobic`,`Ionic`,`Soluble in water`], correct:1, explain:`The hydrophobic fatty acid tails of phospholipids avoid water and cluster together, driving bilayer formation.` },
    { q:`What happens to biological macromolecules when water is removed during dehydration synthesis?`, options:[`They break down into monomers`,`Monomers combine to form polymers with loss of water`,`They ionize into free radicals`,`They undergo photolysis`], correct:1, explain:`Dehydration synthesis joins monomers into polymers, releasing a water molecule for each bond formed.` },
    { q:`Which of the following requires water as a raw material?`, options:[`Aerobic respiration`,`Photosynthesis`,`Lactic acid fermentation`,`Lipid storage`], correct:1, explain:`Photosynthesis requires water as a raw material, split during the light reactions to release electrons, protons, and oxygen.` },
    { q:`Water protects delicate internal organs (such as brain and spinal cord) from mechanical shocks as part of:`, options:[`Cerebrospinal fluid`,`Bile juice`,`Gastric juice`,`Pancreatic juice`], correct:0, explain:`Cerebrospinal fluid, a watery cushion surrounding the brain and spinal cord, absorbs mechanical shocks and protects these delicate organs.` },
    { q:`Which physical property allows water to rise through narrow glass capillaries against gravity?`, options:[`Viscosity`,`Capillary action`,`Heat of fusion`,`Specific gravity`], correct:1, explain:`Capillary action, driven by cohesion and adhesion, allows water to rise against gravity in narrow tubes.` },
    { q:`The latent heat of fusion of water is the energy required to change water from:`, options:[`Liquid to Gas`,`Solid (Ice) to Liquid`,`Gas to Liquid`,`Plasma to Solid`], correct:1, explain:`Latent heat of fusion is the energy needed to convert ice (solid) into liquid water without a temperature change.` },
    { q:`The viscosity of liquid water is relatively low, which facilitates:`, options:[`Fluid movement through circulatory vessels`,`Thermal insulation`,`Structural rigidity of bone`,`Precipitation of proteins`], correct:0, explain:`Water's low viscosity lets it flow easily through narrow blood vessels and circulatory systems with minimal resistance.` },
    { q:`Why do metabolic enzymes function optimally in aqueous solutions?`, options:[`Water provides a rigid lattice`,`Water allows substrate molecules to diffuse and collision rates to optimize`,`Water denatures protein tertiary structures`,`Water removes all functional groups`], correct:1, explain:`Water lets substrates diffuse freely and collide with enzymes at rates that support efficient catalysis.` },
    { q:`The loss of water vapor from the aerial parts of plants through stomata is known as:`, options:[`Guttation`,`Transpiration`,`Imbibition`,`Osmosis`], correct:1, explain:`Transpiration is the evaporative loss of water vapor from a plant's aerial parts, mainly through stomata.` },
    { q:`Water serves as a hydrostatic skeleton in which group of animals?`, options:[`Arthropods (Insects)`,`Soft-bodied invertebrates (e.g., Earthworms)`,`Vertebrates (Mammals)`,`Echinoderms with hard endoskeletons`], correct:1, explain:`Soft-bodied invertebrates like earthworms rely on fluid-filled body compartments as a hydrostatic skeleton, since they lack a rigid skeletal structure.` },

  // ---- Chapter 3 · Biological Molecules · Carbohydrates ----
  // 35 hand-authored, syllabus-accurate MCQs covering carbohydrate
  // classification, ring structures, glycosidic linkages, di- and
  // polysaccharides, diagnostic tests, and related biochemistry
  // (from the PMDC MDCAT biological molecules question set).
  'mdcat-bio-c3-t3': [
    { q:`Carbohydrates are organic compounds composed of carbon, hydrogen, and oxygen, generally having the empirical formula:`, options:[`CₙH₂ₙO₂ₙ`,`Cₙ(H₂O)ₙ`,`C₂ₙHₙOₙ`,`CₙH₍ₙ₊₂₎Oₙ`], correct:1, explain:`Carbohydrates generally follow the empirical formula Cₙ(H₂O)ₙ, reflecting their name — literally "hydrates of carbon."` },
    { q:`Chemically, carbohydrates are defined as polyhydroxy:`, options:[`Esters or Amides`,`Aldehydes or Ketones`,`Carboxylic acids or Amines`,`Alcohols or Ethers`], correct:1, explain:`Carbohydrates are chemically defined as polyhydroxy aldehydes (aldoses) or polyhydroxy ketones (ketoses).` },
    { q:`Which of the following is an example of an aldohexose?`, options:[`Fructose`,`Glucose`,`Ribose`,`Dihydroxyacetone`], correct:1, explain:`Glucose is a 6-carbon sugar with an aldehyde group, making it an aldohexose.` },
    { q:`Fructose is structurally classified as a(n):`, options:[`Aldopentose`,`Ketohexose`,`Aldohexose`,`Ketopentose`], correct:1, explain:`Fructose is a 6-carbon sugar with a ketone functional group, classifying it as a ketohexose.` },
    { q:`Glyceraldehyde and Dihydroxyacetone are examples of:`, options:[`Tetroses`,`Trioses`,`Pentoses`,`Hexoses`], correct:1, explain:`Both are 3-carbon sugars, or trioses — glyceraldehyde is an aldotriose and dihydroxyacetone is a ketotriose.` },
    { q:`Ribose sugar present in RNA molecules is a 5-carbon monosaccharide classified as an:`, options:[`Aldopentose`,`Ketopentose`,`Aldohexose`,`Ketohexose`], correct:0, explain:`Ribose is a 5-carbon sugar with an aldehyde group, making it an aldopentose.` },
    { q:`In aqueous solutions, glucose predominantly exists in a 6-membered ring structure known as a:`, options:[`Furanose ring`,`Pyranose ring`,`Lactone ring`,`Purine ring`], correct:1, explain:`Glucose cyclizes into a 6-membered pyranose ring when dissolved in water.` },
    { q:`Fructose in solution forms a 5-membered ring containing four carbon atoms and one oxygen atom, known as a:`, options:[`Pyranose ring`,`Furanose ring`,`Cyclohexane ring`,`Benzene ring`], correct:1, explain:`Fructose forms a 5-membered furanose ring in solution.` },
    { q:`α-D-glucose and β-D-glucose differ from each other at which specific carbon atom position?`, options:[`Carbon-1 (C1)`,`Carbon-4 (C4)`,`Carbon-5 (C5)`,`Carbon-6 (C6)`], correct:0, explain:`α- and β-D-glucose are anomers that differ only in the orientation of the hydroxyl group at carbon-1, the anomeric carbon.` },
    { q:`Two monosaccharides are covalently linked together through a dehydration condensation reaction forming a:`, options:[`Peptide bond`,`Glycosidic bond`,`Phosphodiester bond`,`Ester bond`], correct:1, explain:`Joining two monosaccharides via dehydration condensation forms a glycosidic bond, releasing a water molecule.` },
    { q:`Maltose is a disaccharide composed of two glucose units linked by an:`, options:[`α(1→4) glycosidic linkage`,`β(1→4) glycosidic linkage`,`α(1→2) glycosidic linkage`,`β(1→2) glycosidic linkage`], correct:0, explain:`Maltose consists of two glucose units joined by an α(1→4) glycosidic linkage.` },
    { q:`Sucrose (table sugar) consists of glucose and fructose held together by which linkage?`, options:[`α(1→4)`,`α(1→2)`,`β(1→4)`,`α(1→6)`], correct:1, explain:`Sucrose's glucose and fructose units are joined by an α(1→2) glycosidic bond between their anomeric carbons.` },
    { q:`Milk sugar (Lactose) is composed of which two monosaccharide subunits?`, options:[`Glucose + Glucose`,`Glucose + Galactose`,`Glucose + Fructose`,`Galactose + Fructose`], correct:1, explain:`Lactose, the sugar found in milk, is composed of glucose and galactose.` },
    { q:`Hydrolysis of sucrose yields:`, options:[`Two molecules of glucose`,`One glucose and one fructose`,`One glucose and one galactose`,`Two molecules of fructose`], correct:1, explain:`Sucrose hydrolyzes into one molecule of glucose and one molecule of fructose.` },
    { q:`Which of the following disaccharides is classified as a NON-REDUCING sugar?`, options:[`Maltose`,`Sucrose`,`Lactose`,`Cellobiose`], correct:1, explain:`Sucrose is non-reducing because the anomeric carbons of both its glucose and fructose units are tied up in the glycosidic bond, leaving no free reactive group.` },
    { q:`Starch is the primary energy storage polysaccharide in plants, consisting of two forms:`, options:[`Glycogen and Amylose`,`Amylose and Amylopectin`,`Cellulose and Chitin`,`Amylopectin and Glycogen`], correct:1, explain:`Starch consists of two glucose polymer forms: unbranched amylose and branched amylopectin.` },
    { q:`Amylose is an unbranched chain of glucose units joined strictly by:`, options:[`β(1→4) glycosidic bonds`,`α(1→4) glycosidic bonds`,`α(1→6) glycosidic bonds`,`β(1→6) glycosidic bonds`], correct:1, explain:`Amylose is an unbranched glucose chain linked exclusively by α(1→4) glycosidic bonds.` },
    { q:`The branching points in Amylopectin occur via which specific glycosidic bond?`, options:[`α(1→4)`,`α(1→6)`,`β(1→4)`,`β(1→6)`], correct:1, explain:`Amylopectin's branch points form via α(1→6) glycosidic bonds, while its main chains use α(1→4) linkages.` },
    { q:`Glycogen, known as animal starch, is structurally similar to amylopectin but differs because it is:`, options:[`Unbranched and insoluble`,`Much more highly branched`,`Made of β-D-glucose`,`Held together by peptide bonds`], correct:1, explain:`Glycogen resembles amylopectin but is far more highly branched, suiting its role as a rapidly mobilized energy reserve.` },
    { q:`In humans and mammals, primary storage of glycogen occurs in which two organs?`, options:[`Brain and Kidneys`,`Liver and Skeletal Muscles`,`Heart and Spleen`,`Pancreas and Stomach`], correct:1, explain:`In humans, glycogen is stored primarily in the liver and skeletal muscles.` },
    { q:`Cellulose is the structural polysaccharide of plant cell walls composed of long linear chains of:`, options:[`α-D-glucose with α(1→4) bonds`,`β-D-glucose with β(1→4) bonds`,`α-D-galactose with α(1→6) bonds`,`β-D-fructose with β(1→2) bonds`], correct:1, explain:`Cellulose is composed of long linear chains of β-D-glucose linked by β(1→4) glycosidic bonds.` },
    { q:`Humans cannot digest cellulose because human digestive enzymes lack:`, options:[`Amylase to hydrolyze α(1→4) bonds`,`Cellulase to hydrolyze β(1→4) bonds`,`Maltase to hydrolyze α(1→6) bonds`,`Sucrase to hydrolyze β(1→2) bonds`], correct:1, explain:`Human digestive enzymes lack cellulase, so we cannot break the β(1→4) bonds that hold cellulose together.` },
    { q:`Chitin, the structural polysaccharide found in fungal cell walls and arthropod exoskeletons, is a polymer of:`, options:[`N-acetylglucosamine (NAG)`,`N-acetylmuramic acid (NAM)`,`D-Glucuronic acid`,`Alpha-D-Galactose`], correct:0, explain:`Chitin is a polymer of repeating N-acetylglucosamine (NAG) units.` },
    { q:`Iodine solution gives a characteristic deep blue/black color when reacted with:`, options:[`Cellulose`,`Starch (Amylose)`,`Glycogen`,`Sucrose`], correct:1, explain:`Starch's helical amylose component traps iodine to produce a characteristic deep blue-black color.` },
    { q:`Iodine solution produces a characteristic reddish-brown color with:`, options:[`Amylose`,`Glycogen`,`Cellulose`,`Glucose`], correct:1, explain:`Glycogen's highly branched structure interacts differently with iodine, giving a reddish-brown color rather than starch's blue-black.` },
    { q:`Which test is universally used to detect reducing sugars in laboratory samples?`, options:[`Biuret Test`,`Benedict's Test / Fehling's Test`,`Iodine Test`,`Grease Spot Test`], correct:1, explain:`Benedict's (or Fehling's) test is the standard laboratory method for detecting reducing sugars.` },
    { q:`Benedict's test forms a brick-red precipitate of Cuprous oxide (Cu₂O) when a reducing sugar reduces:`, options:[`Cu²⁺ (Cupric) ions to Cu⁺ (Cuprous) ions`,`Cu⁺ (Cuprous) ions to Cu²⁺ (Cupric) ions`,`Fe³⁺ ions to Fe²⁺ ions`,`Na⁺ ions to metallic Na`], correct:0, explain:`A reducing sugar donates electrons that reduce Cu²⁺ (cupric) ions to Cu⁺ (cuprous) ions, which precipitate as brick-red Cu₂O.` },
    { q:`The functional group responsible for reducing properties in open-chain aldoses is the:`, options:[`Free ketone group`,`Free aldehyde group`,`Hydroxyl group`,`Carboxyl group`], correct:1, explain:`The free aldehyde group of open-chain aldoses is what gives them their reducing properties.` },
    { q:`What type of reaction breaks down polysaccharides into individual monosaccharide monomers?`, options:[`Condensation`,`Hydrolysis`,`Decarboxylation`,`Oxidation`], correct:1, explain:`Hydrolysis uses water to break glycosidic bonds, breaking polysaccharides down into individual monosaccharide units.` },
    { q:`D-glucose and D-galactose are epimers of each other because they differ only in configuration at:`, options:[`Carbon-2 (C2)`,`Carbon-4 (C4)`,`Carbon-3 (C3)`,`Carbon-5 (C5)`], correct:1, explain:`D-glucose and D-galactose are epimers, differing in configuration only at carbon-4.` },
    { q:`D-glucose and D-mannose are epimers that differ in configuration specifically at:`, options:[`Carbon-2 (C2)`,`Carbon-3 (C3)`,`Carbon-4 (C4)`,`Carbon-5 (C5)`], correct:0, explain:`D-glucose and D-mannose are epimers that differ in configuration only at carbon-2.` },
    { q:`Pectin, hemicellulose, and lignin are structural components associated with:`, options:[`Animal extracellular matrix`,`Plant cell walls`,`Bacterial cell capsule`,`Viral capsids`], correct:1, explain:`Pectin, hemicellulose, and lignin are structural components found alongside cellulose in plant cell walls.` },
    { q:`Peptidoglycan (Murein), which forms the rigid cell wall of bacteria, is a heteropolysaccharide composed of alternating units of:`, options:[`NAG and NAM`,`Glucose and Fructose`,`Amylose and Amylopectin`,`Galactose and Ribose`], correct:0, explain:`Peptidoglycan is built from alternating N-acetylglucosamine (NAG) and N-acetylmuramic acid (NAM) units, cross-linked by short peptide chains.` },
    { q:`The amount of energy released by complete oxidation of 1 gram of glucose is approximately:`, options:[`4.1 kcal (17 kJ)`,`9.3 kcal (38 kJ)`,`2.1 kcal (8 kJ)`,`12.0 kcal (50 kJ)`], correct:0, explain:`Complete oxidation of 1 gram of glucose releases approximately 4.1 kcal (about 17 kJ) of energy.` },
    { q:`Which carbohydrate derivative is an essential component of ATP, NAD+, FAD, and RNA?`, options:[`Deoxyribose`,`Ribose`,`Erythrose`,`Sedoheptulose`], correct:1, explain:`Ribose is the sugar backbone found in ATP, NAD+, FAD, and RNA nucleotides.` },

  // ---- Chapter 3 · Biological Molecules · Proteins ----
  // 50 hand-authored MCQs covering amino acid chemistry, protein

  // denaturation, and protein function (from a PMDC MDCAT proteins &
  // amino acids question set supplied without an answer key — answers
  // below were determined from standard biochemistry, not a source key).
  'mdcat-bio-c3-t4': [
    { q:`Which chemical covalent bond links amino acids together to form polypeptide chains?`, options:[`Glycosidic bond`,`Peptide bond`,`Phosphodiester bond`,`Ester bond`], correct:1, explain:`Amino acids are joined by peptide bonds, formed between the carboxyl group of one and the amino group of the next.` },
    { q:`The functional group that acts as a base by accepting protons in an amino acid is the:`, options:[`Carboxyl group`,`Amino group`,`Side chain (R-group)`,`Phosphate group`], correct:1, explain:`The amino group (-NH2) accepts a proton to become -NH3+, acting as a base.` },
    { q:`Which amino acid lacks an asymmetric carbon atom (chiral center) and has hydrogen as its R-group?`, options:[`Alanine`,`Glycine`,`Valine`,`Leucine`], correct:1, explain:`Glycine's R-group is a single hydrogen atom, so its alpha carbon has two identical substituents (two H atoms) and isn't a chiral center.` },
    { q:`A molecule that contains both positive and negative charges at physiological pH is called a:`, options:[`Cation`,`Anion`,`Zwitterion`,`Isomer`], correct:2, explain:`At physiological pH, an amino acid's amino group is protonated (positive) and its carboxyl group is deprotonated (negative), making it a zwitterion.` },
    { q:`The pH at which an amino acid carries no net electrical charge is its:`, options:[`pK1 value`,`pK2 value`,`Isoelectric point (pI)`,`Buffering pH`], correct:2, explain:`The isoelectric point (pI) is the specific pH at which an amino acid's positive and negative charges balance out, giving it no net charge.` },
    { q:`How many standard amino acids are used by cells to synthesize proteins?`, options:[`10`,`15`,`20`,`64`], correct:2, explain:`Cells use 20 standard amino acids as the building blocks for protein synthesis.` },
    { q:`An amino acid that cannot be synthesized by the human body and must be in diet is:`, options:[`Non-essential`,`Essential amino acid`,`Conditional`,`Non-protein`], correct:1, explain:`Essential amino acids cannot be synthesized by the body and must be obtained through diet.` },
    { q:`The linear sequence of amino acids in a protein constitutes its:`, options:[`Primary structure`,`Secondary structure`,`Tertiary structure`,`Quaternary structure`], correct:0, explain:`Primary structure is simply the linear order of amino acids along the polypeptide chain.` },
    { q:`Alpha-helices and beta-pleated sheets are held in shape primarily by:`, options:[`Disulfide bonds`,`Hydrogen bonds`,`Ionic bonds`,`Hydrophobic forces`], correct:1, explain:`Hydrogen bonds between backbone atoms stabilize the regular, repeating patterns of alpha-helices and beta-pleated sheets.` },
    { q:`The overall 3D shape of a single polypeptide chain is referred to as its:`, options:[`Primary structure`,`Secondary structure`,`Tertiary structure`,`Quaternary structure`], correct:2, explain:`Tertiary structure describes the complete three-dimensional folded shape of one polypeptide chain.` },
    { q:`Which covalent interaction stabilizes tertiary and quaternary structures of proteins?`, options:[`Disulfide bond`,`Peptide bond`,`Hydrogen bond`,`Van der Waals`], correct:0, explain:`Disulfide bonds are covalent cross-links between cysteine residues that help stabilize a protein's tertiary and quaternary folding.` },
    { q:`Disulfide bridges are formed between side chains of which amino acid?`, options:[`Methionine`,`Cysteine`,`Lysine`,`Proline`], correct:1, explain:`Cysteine's sulfhydryl (-SH) side chain forms disulfide bridges with another cysteine's side chain.` },
    { q:`Hemoglobin is a classic example of a protein possessing:`, options:[`Secondary structure`,`Fibrous structure`,`Quaternary structure (4 subunits)`,`Linear structure`], correct:2, explain:`Hemoglobin is made of four polypeptide subunits assembled together, the hallmark of quaternary structure.` },
    { q:`Proteins that are insoluble in water, elongated, and serve structural roles are:`, options:[`Globular proteins`,`Fibrous proteins`,`Enzymatic proteins`,`Regulatory proteins`], correct:1, explain:`Fibrous proteins are typically elongated, water-insoluble, and provide structural support.` },
    { q:`Which of the following is an example of a fibrous protein?`, options:[`Hemoglobin`,`Keratin`,`Insulin`,`Serum albumin`], correct:1, explain:`Keratin is a classic fibrous structural protein found in hair, nails, and skin.` },
    { q:`Globular proteins are generally characterized by being:`, options:[`Insoluble and rigid`,`Soluble and spherical/compact`,`Linear polymers`,`Hair/nail components`], correct:1, explain:`Globular proteins fold into compact, roughly spherical shapes and are typically water-soluble.` },
    { q:`When a protein undergoes denaturation, which level of structure remains intact?`, options:[`Primary structure`,`Secondary structure`,`Tertiary structure`,`Quaternary structure`], correct:0, explain:`Denaturation disrupts secondary, tertiary, and quaternary structure, but the primary sequence — held by covalent peptide bonds — remains intact.` },
    { q:`Which agent can cause protein denaturation by disrupting hydrogen bonding?`, options:[`Extreme pH`,`High heat`,`Heavy metal ions`,`All of the above`], correct:3, explain:`Extreme pH, high heat, and heavy metal ions can all disrupt the hydrogen bonds and other interactions that maintain a protein's folded shape.` },
    { q:`Which of the following proteins functions as a biological catalyst?`, options:[`Collagen`,`Amylase`,`Actin`,`Fibrinogen`], correct:1, explain:`Amylase is an enzyme, a protein that catalyzes biochemical reactions — here, the breakdown of starch.` },
    { q:`Collagen is the main structural protein found in:`, options:[`Hair and nails`,`Connective tissue, cartilage, bone`,`Blood plasma`,`Muscle filaments`], correct:1, explain:`Collagen is the primary structural protein of connective tissue, cartilage, and bone.` },
    { q:`The triple-helical coiled-coil structure is characteristic of which protein?`, options:[`Myoglobin`,`Collagen`,`Keratin`,`Elastin`], correct:1, explain:`Collagen's distinctive triple helix is formed by three polypeptide chains coiled around one another.` },
    { q:`Myoglobin functions in human muscle cells to:`, options:[`Transport oxygen`,`Store oxygen locally in muscle`,`Contract microfilaments`,`Form blood clots`], correct:1, explain:`Myoglobin stores oxygen locally within muscle cells for use during periods of high demand, unlike hemoglobin which transports oxygen through blood.` },
    { q:`In an aqueous cell environment, hydrophobic R-groups of a globular protein are:`, options:[`Exposed on outer surface`,`Tucked inside interior core`,`Bound to water`,`Forming peptide bonds`], correct:1, explain:`Hydrophobic side chains fold inward, away from water, forming the protein's stable interior core.` },
    { q:`During peptide bond formation between two amino acids, what molecule is released?`, options:[`Carbon dioxide`,`Ammonia`,`Water`,`Methane`], correct:2, explain:`Peptide bond formation is a condensation reaction that releases a water molecule.` },
    { q:`Peptide bond formation is classified as what type of reaction?`, options:[`Hydrolysis`,`Dehydration synthesis`,`Reduction`,`Decarboxylation`], correct:1, explain:`Peptide bonds form through dehydration synthesis (condensation), joining amino acids while releasing water.` },
    { q:`Which structural level of protein is directly determined by genetic code in DNA?`, options:[`Primary structure`,`Secondary structure`,`Tertiary structure`,`Quaternary structure`], correct:0, explain:`The DNA sequence directly specifies a protein's primary structure — its amino acid order — via the genetic code.` },
    { q:`Sickle cell anemia is caused by amino acid substitution in which protein?`, options:[`Myoglobin`,`Hemoglobin beta chain`,`Collagen`,`Insulin`], correct:1, explain:`Sickle cell anemia results from a single amino acid substitution (glutamic acid to valine) in the hemoglobin beta chain.` },
    { q:`Proteins that assist in proper folding of newly synthesized proteins are:`, options:[`Ribosomes`,`Chaperones`,`Enzymes`,`Immunoglobulins`], correct:1, explain:`Chaperone proteins help newly synthesized polypeptides fold correctly and prevent misfolding or aggregation.` },
    { q:`The functional group -COOH present in all amino acids is called the:`, options:[`Amino group`,`Carboxyl group`,`Hydroxyl group`,`Carbonyl group`], correct:1, explain:`The -COOH group found on every amino acid is called the carboxyl group.` },
    { q:`Which of the following amino acids contains a basic side chain at neutral pH?`, options:[`Glutamic acid`,`Lysine`,`Alanine`,`Valine`], correct:1, explain:`Lysine has a basic (positively charged) side chain at neutral pH, unlike acidic glutamic acid or the non-polar alanine and valine.` },
    { q:`Which amino acid contains an acidic side chain at neutral pH?`, options:[`Aspartic acid`,`Arginine`,`Leucine`,`Isoleucine`], correct:0, explain:`Aspartic acid's side chain carries a carboxyl group that's negatively charged (acidic) at neutral pH.` },
    { q:`Which amino acid contains a sulfur atom in its side chain alongside cysteine?`, options:[`Threonine`,`Methionine`,`Phenylalanine`,`Tryptophan`], correct:1, explain:`Methionine, like cysteine, contains a sulfur atom in its side chain.` },
    { q:`Proteins combined with non-protein prosthetic groups are referred to as:`, options:[`Simple proteins`,`Conjugated proteins`,`Derived proteins`,`Fibrous proteins`], correct:1, explain:`Conjugated proteins are proteins bound to a non-protein prosthetic group.` },
    { q:`Casein in milk and vitellin in egg yolk are examples of:`, options:[`Glycoproteins`,`Phosphoproteins`,`Lipoproteins`,`Chromoproteins`], correct:1, explain:`Casein and vitellin are phosphoproteins — conjugated proteins with attached phosphate groups.` },
    { q:`Hemoglobin is classified as a conjugated protein belonging to:`, options:[`Metalloproteins`,`Lipoproteins`,`Glycoproteins`,`Nucleoproteins`], correct:0, explain:`Hemoglobin contains iron within its heme prosthetic groups, classifying it as a metalloprotein.` },
    { q:`The non-protein group tightly bound to a conjugated protein is called a:`, options:[`Coenzyme`,`Prosthetic group`,`Apoenzyme`,`Substrate`], correct:1, explain:`The tightly (often permanently) bound non-protein component of a conjugated protein is its prosthetic group.` },
    { q:`Actin and myosin are functional proteins primarily responsible for:`, options:[`Oxygen transport`,`Muscle contraction`,`Immune defense`,`Blood clotting`], correct:1, explain:`Actin and myosin are the contractile proteins responsible for muscle contraction.` },
    { q:`Antibodies (Immunoglobulins) are specialized defensive proteins produced by:`, options:[`Red blood cells`,`B lymphocytes`,`T helper cells`,`Platelets`], correct:1, explain:`B lymphocytes (B cells) produce and secrete antibodies as part of the adaptive immune response.` },
    { q:`Fibrinogen is a plasma protein essential for:`, options:[`Osmotic pressure`,`Blood clotting`,`Lipid transport`,`Hormone secretion`], correct:1, explain:`Fibrinogen is converted to fibrin during the clotting cascade, forming the mesh that stabilizes blood clots.` },
    { q:`Albumin in human blood plasma primarily functions to:`, options:[`Transport oxygen`,`Maintain osmotic pressure`,`Digest lipids`,`Form cartilage`], correct:1, explain:`Albumin, the most abundant plasma protein, helps maintain the blood's osmotic (oncotic) pressure.` },
    { q:`Which hormone is a peptide hormone consisting of two polypeptide chains?`, options:[`Estrogen`,`Testosterone`,`Insulin`,`Thyroxine`], correct:2, explain:`Insulin is a peptide hormone made of two polypeptide chains (A and B) linked by disulfide bonds.` },
    { q:`The secondary structure known as beta-pleated sheet can be:`, options:[`Parallel or anti-parallel`,`Triple helical`,`Spherical`,`Random coil`], correct:0, explain:`Beta-pleated sheets can form in either a parallel or anti-parallel arrangement of the polypeptide strands.` },
    { q:`Prion diseases result from misfolding of cellular proteins into:`, options:[`Alpha-helices`,`Beta-sheet rich forms`,`Random coils`,`Disulfide bonds`], correct:1, explain:`Prion diseases arise when normal alpha-helix-rich proteins misfold into infectious beta-sheet-rich conformations.` },
    { q:`The monomeric repeating units of proteins are:`, options:[`Monosaccharides`,`Fatty acids`,`Amino acids`,`Nucleotides`], correct:2, explain:`Amino acids are the monomer units that link together to form protein polymers.` },
    { q:`Which test reagent yields a purple color in the presence of peptide bonds?`, options:[`Benedict's`,`Iodine`,`Biuret reagent`,`Sudan III`], correct:2, explain:`The Biuret reagent produces a violet/purple color upon reacting with peptide bonds, used to detect proteins.` },
    { q:`How many peptide bonds are present in a linear tripeptide molecule?`, options:[`1`,`2`,`3`,`4`], correct:1, explain:`A tripeptide contains 3 amino acids linked by 2 peptide bonds.` },
    { q:`Thermal denaturation of proteins occurs primarily because heat disrupts:`, options:[`Peptide bonds`,`Non-covalent interactions`,`Disulfide bonds`,`Stereochemistry`], correct:1, explain:`Heat primarily disrupts the weaker non-covalent interactions (hydrogen bonds, hydrophobic interactions) that maintain a protein's folded shape, without breaking the covalent peptide backbone.` },
    { q:`Silk fibroin is an example of a structural protein composed largely of:`, options:[`Alpha-helices`,`Beta-pleated sheets`,`Triple helices`,`Random loops`], correct:1, explain:`Silk fibroin is built largely from stacked beta-pleated sheets, giving silk its strength and flexibility.` },
    { q:`The amino acid sequence directionality of any polypeptide is written from:`, options:[`C to N terminus`,`N to C terminus`,`5' to 3' end`,`3' to 5' end`], correct:1, explain:`By convention, polypeptide sequences are written starting from the free amino (N) terminus to the free carboxyl (C) terminus.` },
    { q:`Which of the following is NOT a function of proteins in living organisms?`, options:[`Catalysis`,`Structure`,`Primary long-term energy storage in fat`,`Defense`], correct:2, explain:`Long-term energy storage as fat is the role of lipids, not proteins — proteins instead serve as enzymes, structural components, and defense molecules.` },

    { q:`Lipids are heterogeneous organic compounds unified by their common property of being:`, options:[`Highly soluble in polar solvents like water`,`Insoluble in water but soluble in non-polar organic solvents`,`Polymers composed of amino acid monomers`,`Hydrophilic charged molecules`], correct:1, explain:`Despite their chemical diversity, all lipids share the property of being insoluble in water but soluble in non-polar organic solvents.` },
    { q:`Chemically, neutral fats (triglycerides) are esters composed of fatty acids bonded to:`, options:[`Ethanol`,`Glycerol`,`Sphingosine`,`Cholesterol`], correct:1, explain:`Triglycerides are esters formed from three fatty acid chains bonded to a glycerol backbone.` },
    { q:`Glycerol is a trihydric alcohol containing how many carbon atoms and hydroxyl (-OH) groups?`, options:[`2 carbons and 2 -OH groups`,`3 carbons and 3 -OH groups`,`4 carbons and 4 -OH groups`,`6 carbons and 6 -OH groups`], correct:1, explain:`Glycerol has 3 carbon atoms, each bearing a hydroxyl group, making it a trihydric (three -OH) alcohol.` },
    { q:`The covalent linkage formed between a carboxyl group (-COOH) of a fatty acid and a hydroxyl group (-OH) of glycerol is an:`, options:[`Ether bond`,`Ester bond`,`Glycosidic bond`,`Peptide bond`], correct:1, explain:`Fatty acids attach to glycerol through ester bonds, formed by condensation reactions.` },
    { q:`During the synthesis of one molecule of Triacylglycerol (Triglyceride) from glycerol and three fatty acids, how many water molecules are released?`, options:[`1`,`3`,`2`,`4`], correct:1, explain:`Each of the three ester bonds formed releases one water molecule, so triglyceride synthesis releases 3 molecules of water total.` },
    { q:`Fatty acids that contain NO double bonds between carbon atoms in their hydrocarbon chain are classified as:`, options:[`Unsaturated fatty acids`,`Saturated fatty acids`,`Polyunsaturated fatty acids`,`Essential fatty acids`], correct:1, explain:`Saturated fatty acids have only single bonds between carbon atoms in their chain, with no double bonds.` },
    { q:`Saturated fatty acids generally have higher melting points and exist at room temperature (25°C) as:`, options:[`Liquids (Oils)`,`Solids (Fats)`,`Gases`,`Vapors`], correct:1, explain:`Saturated fatty acid chains pack tightly together, giving them higher melting points and a solid state at room temperature.` },
    { q:`Unsaturated fatty acids contain double bonds (C=C) which introduce bends or "kinks" in the chain, causing them to be:`, options:[`Solid at room temperature`,`Liquid (Oils) at room temperature`,`Highly crystalline`,`Completely water-soluble`], correct:1, explain:`The kinks from double bonds prevent tight packing, lowering the melting point so unsaturated fats are typically liquid oils at room temperature.` },
    { q:`Palmitic acid is a common saturated fatty acid having how many total carbon atoms?`, options:[`14`,`16`,`18`,`20`], correct:1, explain:`Palmitic acid is a 16-carbon saturated fatty acid.` },
    { q:`Oleic acid is an unsaturated fatty acid containing 18 carbon atoms and how many double bonds?`, options:[`One double bond between C9 and C10`,`Two double bonds`,`Three double bonds`,`No double bonds`], correct:0, explain:`Oleic acid is a monounsaturated 18-carbon fatty acid with a single double bond located between carbons 9 and 10.` },
    { q:`Stearic acid is a saturated fatty acid possessing how many carbon atoms in its hydrocarbon chain?`, options:[`16`,`18`,`20`,`12`], correct:1, explain:`Stearic acid is an 18-carbon saturated fatty acid.` },

    { q:`Phospholipids differ structurally from triglycerides because one fatty acid is replaced by a phosphate group attached to a:`, options:[`Carbohydrate chain`,`Nitrogenous base (e.g., Choline)`,`Steroid ring`,`Hydrocarbon wax`], correct:1, explain:`In phospholipids, one fatty acid position is replaced by a phosphate group typically linked to a nitrogenous base such as choline.` },
    { q:`Molecules containing both a hydrophilic (polar) head and a hydrophobic (non-polar) tail, such as phospholipids, are called:`, options:[`Amphipathic (Amphiphilic)`,`Amphoteric`,`Apolar`,`Hydrophobic`], correct:0, explain:`Amphipathic (or amphiphilic) molecules have both a polar hydrophilic region and a non-polar hydrophobic region, as seen in phospholipids.` },
    { q:`In an aqueous environment, phospholipids spontaneously aggregate into a double-layered structure forming the backbone of:`, options:[`Bacterial cell walls`,`Biological cell membranes`,`Chromosomes`,`Ribosomes`], correct:1, explain:`Phospholipids spontaneously self-assemble into bilayers in water, forming the structural backbone of biological cell membranes.` },
    { q:`Lecithin is a medically important phospholipid composed of phosphatidic acid linked to:`, options:[`Serine`,`Choline`,`Ethanolamine`,`Inositol`], correct:1, explain:`Lecithin (phosphatidylcholine) is phosphatidic acid linked to the nitrogenous base choline.` },
    { q:`Waxes are protective lipids composed of long-chain fatty acids esterified to long-chain:`, options:[`Glycerol molecules`,`High molecular weight monohydric alcohols`,`Amino acids`,`Glucose units`], correct:1, explain:`Unlike triglycerides, waxes are esters of long-chain fatty acids with high molecular weight monohydric alcohols rather than glycerol.` },
    { q:`The protective waxy layer present on the outer cuticle of plant leaves and stems to prevent water loss (transpiration) is:`, options:[`Chitin`,`Cutin`,`Suberin`,`Pectin`], correct:1, explain:`Cutin forms the waterproof cuticle layer on plant leaves and stems, reducing water loss through transpiration.` },
    { q:`Terpenoids are a large class of lipids built from repeating 5-carbon units called:`, options:[`Acetyl units`,`Isoprene units (C5H8)`,`Glycerol units`,`Phosphate units`], correct:1, explain:`Terpenoids are built from repeating 5-carbon isoprene units.` },
    { q:`Steroids are characterized by a core structure composed of how many fused carbon rings?`, options:[`3 rings`,`4 fused rings (3 six-membered + 1 five-membered)`,`5 six-membered rings`,`2 fused benzene rings`], correct:1, explain:`Steroids share a core structure of 4 fused rings — three six-membered rings and one five-membered ring.` },
    { q:`Which sterol is a key structural component of animal cell membranes and serves as the precursor for steroid hormones?`, options:[`Ergosterol`,`Cholesterol`,`Stigmasterol`,`Suberin`], correct:1, explain:`Cholesterol is embedded in animal cell membranes and serves as the precursor for synthesizing steroid hormones.` },
    { q:`Which human hormones are synthesized directly from Cholesterol?`, options:[`Insulin and Glucagon`,`Aldosterone, Cortisol, Testosterone, and Estrogen`,`Thyroxine and Triiodothyronine`,`Epinephrine and Norepinephrine`], correct:1, explain:`Steroid hormones — aldosterone, cortisol, testosterone, and estrogen — are all synthesized directly from cholesterol.` },
    { q:`Lipids yield more than TWICE the energy per gram compared to carbohydrates because lipids contain a higher proportion of:`, options:[`Oxygen atoms`,`C-H bonds relative to oxygen`,`Nitrogen atoms`,`Ester linkages`], correct:1, explain:`Lipids have a much higher ratio of C-H bonds to oxygen than carbohydrates, meaning more energy is released when they're fully oxidized.` },
    { q:`Adipose tissue contains specialized lipid-storing cells called:`, options:[`Chondrocytes`,`Adipocytes`,`Osteocytes`,`Hepatocytes`], correct:1, explain:`Adipocytes are the specialized fat-storing cells that make up adipose tissue.` },
    { q:`Industrial hydrogenation of unsaturated liquid oils converts cis double bonds into solid fats, generating harmful byproducts known as:`, options:[`Essential fatty acids`,`Trans fats`,`Phospholipids`,`Glycolipids`], correct:1, explain:`Partial hydrogenation of oils can flip some remaining cis double bonds into the trans configuration, producing harmful trans fats.` },
    { q:`Sphingolipids, which form the myelin sheath insulating nerve axons, contain an amino alcohol base called:`, options:[`Glycerol`,`Sphingosine`,`Choline`,`Serine`], correct:1, explain:`Sphingolipids are built on a sphingosine backbone rather than glycerol, and are major components of the myelin sheath.` },
    { q:`A glycolipid consists of a carbohydrate covalently linked to a:`, options:[`Protein`,`Lipid (Lipid moiety)`,`Nucleic acid`,`Phosphate ion`], correct:1, explain:`Glycolipids are formed when a carbohydrate group is covalently attached to a lipid moiety.` },
    { q:`Prostaglandins, which mediate inflammation, fever, and pain perception, are derived from which 20-carbon fatty acid?`, options:[`Oleic acid`,`Arachidonic acid`,`Stearic acid`,`Linoleic acid`], correct:1, explain:`Prostaglandins are synthesized from arachidonic acid, a 20-carbon polyunsaturated fatty acid.` },
    { q:`Alkaline hydrolysis of fats with a strong base (such as NaOH) to form glycerol and soap salts is called:`, options:[`Hydrogenation`,`Saponification`,`Esterification`,`Condensation`], correct:1, explain:`Saponification is the alkaline hydrolysis of fats, producing glycerol and fatty acid salts (soap).` },
    { q:`Which fat-soluble vitamins are chemically classified as isoprenoid/terpenoid lipid derivatives?`, options:[`Vitamins B and C`,`Vitamins A, D, E, and K`,`Vitamins B1 and B12`,`Folic acid and Biotin`], correct:1, explain:`Vitamins A, D, E, and K are all fat-soluble and chemically classified as isoprenoid/terpenoid lipid derivatives.` },
    { q:`Cholesterol acts as a temperature buffer in plasma membranes by preventing excessive fluidity at high temps and preventing:`, options:[`Protein denaturation`,`Membrane freezing/solidification at low temperatures`,`Lysis of cytoplasm`,`Active transport stop`], correct:1, explain:`Cholesterol moderates membrane fluidity — restraining excess fluidity at high temperatures while preventing the membrane from solidifying at low temperatures.` },

/* ================================================================
   QUESTION GENERATION
   A topic uses its hand-authored bank from CUSTOM_QUESTION_BANKS
   when one exists (real, vetted exam-style MCQs — see the Viruses
   and AIDS/HIV banks above for the PMDC MDCAT set). A custom bank
   can hold far more than 15 questions — each quiz attempt randomly
   samples QUIZ_LENGTH of them (see generateQuestionBank below), so
   revisiting a topic serves a fresh mix instead of the same fixed
   set every time, while still drawing only from vetted content.

   Any topic without a custom bank falls back to a deterministic
   15-question placeholder set, seeded on the topic id so the same
   topic always produces the same questions and progress stays
   stable across sessions. Replace more topics over time by adding
   entries to CUSTOM_QUESTION_BANKS[topicId].
   ================================================================ */

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (Math.imul(31,h) + s.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mcq(rng, q, correctText, distractorPool, explain){
  const pool = distractorPool.slice();
  const chosen = [];
  while(chosen.length < 3 && pool.length){
    const i = Math.floor(rng() * pool.length);
    chosen.push(pool.splice(i,1)[0]);
  }
  const options = [correctText, ...chosen];
  for(let i=options.length-1;i>0;i--){
    const j = Math.floor(rng() * (i+1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  return { q, options, correct: options.indexOf(correctText), explain };
}

/* A quiz session is always this many questions long. Custom banks
   bigger than this get randomly sampled down each time; smaller
   or generated banks just use everything they have. */
const QUIZ_LENGTH = 15;
/* "Bonus" quizzes: the topic's bank holds 6 questions. Each attempt shuffles them,
   shows the first 5, and only serves the 6th (bonus) if at least one of the 5 was wrong.
   Score = correct answers (capped at 5) out of 5, so the bonus can only help. */
const BONUS_MAIN_COUNT = 5;
function isBonusQuizTopic(id){ return id.indexOf('sat-math-gra-') === 0 || id.indexOf('sat-math-pda-') === 0 || id.indexOf('sat-math-adv-') === 0 || id.indexOf('sat-math-geo-') === 0; }   // every topic in SAT > Math > Get ready: Algebra / Get ready: Problem solving and data analysis

/* Fisher–Yates-style random draw (true Math.random, not seeded) —
   picks up to `count` items from `bank` in random order without
   repeats, so a large custom bank serves a different-feeling quiz
   on every visit instead of the same fixed set in the same order. */
function pickRandomQuestions(bank, count){
  const pool = bank.slice();
  const picked = [];
  while(picked.length < count && pool.length){
    const i = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(i, 1)[0]);
  }
  return picked;
}

function generateQuestionBank(topic, type){
  if(isBonusQuizTopic(topic.id) && CUSTOM_QUESTION_BANKS[topic.id]){
    const b = CUSTOM_QUESTION_BANKS[topic.id];
    return pickRandomQuestions(b, b.length);   // all 6, shuffled: first 5 main, 6th = bonus
  }
  if(CUSTOM_QUESTION_BANKS[topic.id]){
    // Hand-authored banks can hold far more than one quiz's worth
    // (e.g. 42 Viruses questions) — each visit draws a fresh random
    // 15 so repeat practice doesn't mean memorizing the same set.
    return pickRandomQuestions(CUSTOM_QUESTION_BANKS[topic.id], QUIZ_LENGTH);
  }
  const rng = mulberry32(hashStr(topic.id));
  const templates = TEMPLATES[type] || TEMPLATES.logical;
  const bank = [];
  for(let i=0;i<QUIZ_LENGTH;i++){
    bank.push(templates[i % templates.length](topic.name, rng));
  }
  return bank;
}

const MOCK_SECTIONS = [
  { name:'Biology',           from:1,   to:68  },
  { name:'Chemistry',         from:69,  to:122 },
  { name:'Physics',           from:123, to:162 },
  { name:'English',           from:163, to:174 },
  { name:'Logical Reasoning', from:175, to:180 },
];
const MOCK_MINUTES = 180;
const MOCK_BEST_KEY = 'merit_mock_best_v1';
const MOCK_SESSION_KEY = 'merit_mock_session_v1';

function mockSectionOf(i){ const n = i+1; return MOCK_SECTIONS.find(s=>n>=s.from && n<=s.to); }
function loadMockBest(){ try{ return JSON.parse(localStorage.getItem(MOCK_BEST_KEY)) || null; }catch(e){ return null; } }
function loadMockSession(){
  try{
    const s = JSON.parse(localStorage.getItem(MOCK_SESSION_KEY));
    if(s && typeof s.endAt==='number' && Array.isArray(s.answers) && s.answers.length===MDCAT_MOCK.length) return s;
  }catch(e){}
  return null;
}
function saveMockSession(){
  const m = state.mock; if(!m) return;
  try{ localStorage.setItem(MOCK_SESSION_KEY, JSON.stringify({ endAt:m.endAt, answers:m.answers, index:m.index })); }catch(e){}
}
function clearMockSession(){ try{ localStorage.removeItem(MOCK_SESSION_KEY); }catch(e){} }
function fmtClock(ms){
  const t = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(t/3600), mi = Math.floor((t%3600)/60), s = t%60;
  return h + ':' + String(mi).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

let mockTimerId = null;
function tickMockTimer(){
  const m = state.mock;
  if(!m || state.view!=='mock') return;
  const left = m.endAt - Date.now();
  if(left <= 0){ submitMock(true); return; }
  const el = document.getElementById('mock-timer');
  if(el){ el.textContent = fmtClock(left); el.classList.toggle('warn', left < 10*60*1000); }
}
function startMockTimer(){ if(mockTimerId===null) mockTimerId = setInterval(tickMockTimer, 1000); tickMockTimer(); }
function stopMockTimer(){ if(mockTimerId!==null){ clearInterval(mockTimerId); mockTimerId = null; } }

function openMockIntro(){ go('mockIntro', { courseId:'mdcat', subjectId:null, chapterId:null }); }
function startMock(){
  state.mock = { answers:new Array(MDCAT_MOCK.length).fill(null), index:0, endAt:Date.now()+MOCK_MINUTES*60000, palette:false, result:null, reviewOpen:false };
  saveMockSession();
  go('mock');
}
function resumeMock(){
  const s = loadMockSession();
  if(!s){ startMock(); return; }
  const answers = s.answers.map(a=> (Number.isInteger(a) && a>=0 && a<=3) ? a : null);
  state.mock = { answers, index:Math.min(Math.max(Number(s.index)||0, 0), MDCAT_MOCK.length-1), endAt:s.endAt, palette:false, result:null, reviewOpen:false };
  if(s.endAt <= Date.now()){ submitMock(true); return; }
  go('mock');
}
function mockPick(k){
  const m = state.mock; if(!m) return;
  m.answers[m.index] = (m.answers[m.index]===k) ? null : k;   // tap again to clear
  saveMockSession();
  render();
}
function mockGo(n){
  const m = state.mock; if(!m) return;
  m.index = Math.min(Math.max(n, 0), MDCAT_MOCK.length-1);
  m.palette = false;
  saveMockSession();
  go('mock');
}
function mockTogglePalette(){ state.mock.palette = !state.mock.palette; render(); }
function mockExit(){
  if(!confirm('Leave the test for now? The timer keeps running. You can resume from the MDCAT MOCK TEST page until time runs out.')) return;
  saveMockSession();
  openMockIntro();
}
function submitMock(auto){
  const m = state.mock; if(!m) return;
  const unanswered = m.answers.filter(a=>a===null).length;
  if(!auto){
    const msg = unanswered ? `You have ${unanswered} unanswered question${unanswered===1?'':'s'}. Submit the test now?` : 'Submit the test now?';
    if(!confirm(msg)) return;
  }
  const total = MDCAT_MOCK.length;
  const sections = MOCK_SECTIONS.map(s=>({ name:s.name, correct:0, total:s.to-s.from+1 }));
  let score = 0;
  m.answers.forEach((a,i)=>{
    if(a!==null && a===MDCAT_MOCK[i][2]){
      score++;
      sections[MOCK_SECTIONS.indexOf(mockSectionOf(i))].correct++;
    }
  });
  const totalMs = MOCK_MINUTES*60000;
  const usedMs = Math.min(totalMs, Math.max(0, totalMs - Math.max(0, m.endAt - Date.now())));
  const pct = Math.round((score/total)*100);
  m.result = { score, total, pct, sections, unanswered, usedMs, auto:!!auto };
  const best = loadMockBest() || { bestScore:0, attempts:0 };
  best.attempts += 1;
  best.bestScore = Math.max(best.bestScore, score);
  try{ localStorage.setItem(MOCK_BEST_KEY, JSON.stringify(best)); }catch(e){}
  clearMockSession();
  stopMockTimer();
  go('mockResults');
}
function mockToggleReview(){ state.mock.reviewOpen = !state.mock.reviewOpen; render(); }

function renderMockRow(){
  const best = loadMockBest();
  const sess = loadMockSession();
  const sub = sess ? 'Test in progress · tap to resume'
    : `${MDCAT_MOCK.length} MCQs · ${MOCK_MINUTES} min` + (best ? ` · Best: ${best.bestScore}/${MDCAT_MOCK.length}` : '');
  return `
  <div class="row-list" style="margin-top:12px;">
    <button class="row-card mock-row" data-mopen="1">
      <div class="row-icon">${ICONS.clock}</div>
      <div class="row-body">
        <div class="row-title">MDCAT MOCK TEST</div>
        <div class="row-sub">${esc(sub)}</div>
      </div>
      <span class="row-chev">${ICONS.chevron}</span>
    </button>
  </div>`;
}

  const best = loadMockBest();

/* ================================================================

   ================================================================ */
function findCourse(id){ return COURSES.find(c=>c.id===id); }
function findSubject(course,id){ return course.subjects.find(s=>s.id===id); }
function findChapter(subject,id){ return subject.chapters.find(c=>c.id===id); }
function findTopic(chapter,id){ return chapter.topics.find(t=>t.id===id); }

function allTopicsOfCourse(course){
  const out = [];
  course.subjects.forEach(s=>s.chapters.forEach(c=>c.topics.forEach(t=>out.push(t))));
  return out;
}
function allTopicsOfSubject(subject){
  const out = [];
  subject.chapters.forEach(c=>c.topics.forEach(t=>out.push(t)));
  return out;
}
function courseProgressPct(course){
  const topics = allTopicsOfCourse(course);
  if(!topics.length) return 0;
  const mastered = topics.filter(t=>progress[t.id]?.mastered).length;
  return Math.round((mastered/topics.length)*100);
}
function subjectProgressPct(subject){
  const topics = allTopicsOfSubject(subject);
  if(!topics.length) return 0;
  const mastered = topics.filter(t=>progress[t.id]?.mastered).length;
  return Math.round((mastered/topics.length)*100);
}
function chapterProgressPct(chapter){
  if(!chapter.topics.length) return 0;
  const mastered = chapter.topics.filter(t=>progress[t.id]?.mastered).length;
  return Math.round((mastered/chapter.topics.length)*100);
}

/* ================================================================
   APP STATE + ROUTING
   ================================================================ */
const state = {
  tab: 'courses',       // courses | progress | saved
  view: 'courses',      // courses | subjects | chapters | topics | quiz | results
  courseId: null,
  subjectId: null,
  chapterId: null,
  topicId: null,
  quiz: null,            // { bank, index, correctCount, selected, answered, locked }
};

function go(view, patch){
  Object.assign(state, patch||{});
  state.view = view;
  render();
  window.scrollTo({top:0, behavior:'instant' in window.scrollTo ? 'instant' : 'auto'});
}
function goTab(tab){
  state.tab = tab;
  state.view = tab === 'progress' ? 'progressView' : tab === 'saved' ? 'savedView' : 'courses';
  state.courseId = null; state.subjectId = null; state.chapterId = null; state.topicId = null; state.quiz = null;
  render();
}

function startQuiz(topicId, courseId, subjectId, chapterId){
  const course = findCourse(courseId);
  const subject = findSubject(course, subjectId);
  const chapter = findChapter(subject, chapterId);
  const topic = findTopic(chapter, topicId);
  const bank = generateQuestionBank(topic, subject.type);
  const bonus = isBonusQuizTopic(topicId) && bank.length > BONUS_MAIN_COUNT;
  activity.last = { courseId, subjectId, chapterId, topicId };
  saveActivity();
  state.quiz = { bank, index:0, correctCount:0, wrongCount:0, bonus, mainCount: bonus ? BONUS_MAIN_COUNT : bank.length, selected:null, answered:null, locked:false };
  go('quiz', { courseId, subjectId, chapterId, topicId });
}

/* Step 1: tapping an option just selects it — no grading yet, so the
   person can change their mind before committing. */
function selectAnswer(optionIndex){
  const q = state.quiz;
  if(q.locked) return;
  q.selected = optionIndex;
  render();
}
/* Step 2: "Check Answer" locks in the current selection, grades it,
   and reveals correct/incorrect + explanation. */
function checkAnswer(){
  const q = state.quiz;
  if(q.locked || q.selected===null) return;
  q.locked = true;
  q.answered = q.selected;
  const question = q.bank[q.index];
  if(q.answered === question.correct) q.correctCount++; else q.wrongCount++;
  recordAnswer();
  render();
}
/* Is there another question after the current one? In a bonus quiz the 6th question
   is only served when at least one of the first 5 was answered wrongly. */
function quizHasNext(q){
  if(q.bonus){
    if(q.index < q.mainCount-1) return true;
    if(q.index === q.mainCount-1) return q.wrongCount > 0 && q.bank.length > q.mainCount;
    return false;
  }
  return q.index < q.bank.length-1;
}
function nextQuiz(){
  const q = state.quiz;
  if(quizHasNext(q)){
    q.index++; q.selected = null; q.answered = null; q.locked = false;
    render();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  const q = state.quiz;
  const pct = q.bonus
    ? Math.round((Math.min(q.correctCount, q.mainCount) / q.mainCount) * 100)
    : Math.round((q.correctCount / q.bank.length) * 100);
  const existing = progress[state.topicId] || { bestScore:0, attempts:0, mastered:false };
  existing.attempts += 1;
  existing.bestScore = Math.max(existing.bestScore, pct);
  existing.mastered = existing.bestScore >= MASTERY_THRESHOLD;
  progress[state.topicId] = existing;
  saveProgress();
  state.lastScore = pct;
  go('results');
}
function retryQuiz(){
  startQuiz(state.topicId, state.courseId, state.subjectId, state.chapterId);
}
function toggleStar(courseId){
  if(starred.has(courseId)) starred.delete(courseId); else starred.add(courseId);
  saveStarred();
  render();
}

/* ================================================================
   RENDER HELPERS
   ================================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================================================================
   DAILY ACTIVITY: streak, daily goal, last-practiced topic, name
   ================================================================ */
const ACT_KEY = 'merit_activity_v1';
function loadActivity(){ try{ return JSON.parse(localStorage.getItem(ACT_KEY)) || {}; }catch(e){ return {}; } }
let activity = loadActivity();   // { name, goal, days:{'YYYY-MM-DD':count}, last:{courseId,subjectId,chapterId,topicId} }
function saveActivity(){ try{ localStorage.setItem(ACT_KEY, JSON.stringify(activity)); }catch(e){} }
function dayKey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayCount(){ return (activity.days && activity.days[dayKey()]) || 0; }
function dailyGoal(){ return activity.goal || 20; }
/* Streak = consecutive days (ending today, or yesterday if you haven't practiced yet today) with at least 1 answered question. */
function streakCount(){
  const days = activity.days || {};
  const d = new Date();
  if(!days[dayKey(d)]) d.setDate(d.getDate()-1);
  let n = 0;
  while(days[dayKey(d)] > 0){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function recordAnswer(){
  activity.days = activity.days || {};
  const k = dayKey();
  activity.days[k] = (activity.days[k] || 0) + 1;
  saveActivity();
}
function flattenCourse(course){
  const out = [];
  course.subjects.forEach(s=>s.chapters.forEach(ch=>ch.topics.forEach(t=>out.push({courseId:course.id, subjectId:s.id, chapterId:ch.id, subject:s, chapter:ch, topic:t}))));
  return out;
}
/* Where should "Continue" take the student in this course?
   The last topic they practiced if it isn't mastered yet, otherwise the next unmastered topic after it. */
function nextTargetFor(course, lastTopicId){
  const list = flattenCourse(course);
  if(!list.length) return null;
  let start = 0;
  if(lastTopicId){
    const i = list.findIndex(x=>x.topic.id===lastTopicId);
    if(i >= 0){
      if(!progress[lastTopicId]?.mastered) return Object.assign({resume:true}, list[i]);
      start = i+1;
    }
  }
  for(let k=0;k<list.length;k++){
    const x = list[(start+k) % list.length];
    if(!progress[x.topic.id]?.mastered) return Object.assign({resume:false}, x);
  }
  return Object.assign({resume:false, allDone:true}, list[start % list.length]);
}
function activeCourseId(){
  const c = activity.last && COURSES.find(x=>x.id===activity.last.courseId);
  return c ? c.id : null;
}
function resumeCourse(courseId){
  const course = findCourse(courseId);
  const last = activity.last && activity.last.courseId===courseId ? activity.last.topicId : null;
  const t = course && nextTargetFor(course, last);
  if(!t) return go('subjects', {courseId});
  startQuiz(t.topic.id, t.courseId, t.subjectId, t.chapterId);
}

function renderBreadcrumbs(){
  const crumbs = [{label:'Home', action:"data-nav='courses'"}];
  const course = state.courseId ? findCourse(state.courseId) : null;

  const chapter = subject && state.chapterId ? findChapter(subject, state.chapterId) : null;

  if(course) crumbs.push({label:course.name, action:`data-nav="subjects" data-course="${course.id}"`});
  if(subject) crumbs.push({label:subject.name, action:`data-nav="chapters" data-course="${course.id}" data-subject="${subject.id}"`});
  if(chapter) crumbs.push({label:chapter.name, action:`data-nav="topics" data-course="${course.id}" data-subject="${subject.id}" data-chapter="${chapter.id}"`});

  if(crumbs.length<=1 && !['quiz','results'].includes(state.view)) return '';

  return `<div class="breadcrumbs">${crumbs.map((c,i)=>{
    const isLast = i===crumbs.length-1 && !['quiz','results'].includes(state.view);
    if(isLast) return `<span class="current">${esc(c.label)}</span>`;
    return `<button ${c.action}>${esc(c.label)}</button><span class="sep">/</span>`;
  }).join('')}</div>`;
}

function greetingHTML(){

  else if(today === 0 && streak > 0) sub = `Keep your ${streak}-day streak alive — complete today's 5-minute drill.`;
